# Modelos a comparar con run.py.
#
# name      nombre de la carpeta en results/ (y de la columna en el reporte)
# provider  anthropic | openai | gemini | groq | openrouter | ollama
# model     ID exacto del modelo. Para verlos: python scripts/prompt_bench/run.py --list-models <provider>
# enabled   false = no corre salvo que lo pidas con --models
# Opcionales: temperature, effort (solo Anthropic), json_mode (default true en no-Anthropic),
#             max_tokens (solo Anthropic), price_input_per_mtok / price_output_per_mtok (USD por millón de tokens).
#
# Precios de Anthropic verificados el 2026-10-08. Los demás: revísalos en la consola de cada proveedor.
# Ojo: los modelos 5.5 de Claude no aceptan temperature (dan error 400); se controlan con effort.

[[models]]
name = "claude-haiku-4-5"
provider = "anthropic"
model = "claude-haiku-4-5"
enabled = true
temperature = 0
price_input_per_mtok = 1.00
price_output_per_mtok = 5.00

[[models]]
name = "claude-haiku-5-5"
provider = "anthropic"
model = "claude-haiku-5-5"
enabled = true
effort = "medium"
max_tokens = 40000   # 20.000 cortaba las llamadas reales de 13+ min; run.py usa streaming (el SDK lo exige sobre ~21.000)
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50

[[models]]
name = "claude-sonnet-5-5"
provider = "anthropic"
model = "claude-sonnet-5-5"
enabled = true
effort = "medium"
price_input_per_mtok = 2.00
price_output_per_mtok = 10.00

# IDs de Gemini, OpenAI y Groq tomados de --list-models el 2026-10-08.
# Precios de Gemini, OpenAI y Groq: agregadores de precios al 2026-10-08 (no la página oficial); confirmar antes de presupuestar.
# Gemini 3.8 Flash: precio introductorio hasta el 2026-12-31; desde 2027 sube a 1,50 / 7,50.

[[models]]
name = "gemini-3-5-flash-lite"
provider = "gemini"
model = "gemini-3.5-flash-lite"
enabled = true
tool_mode = true   # en modo JSON devolvía el esquema en vez de la respuesta (prompt v2.0)
temperature = 0
price_input_per_mtok = 0.30
price_output_per_mtok = 2.50

[[models]]
name = "gemini-3-8-flash"
provider = "gemini"
model = "gemini-3.8-flash"
enabled = true
temperature = 0
max_tokens = 32000   # igual que por OpenRouter: con 16.000 se cortaba
price_input_per_mtok = 0.75
price_output_per_mtok = 3.75

[[models]]
name = "gpt-6-luna"
provider = "openai"
model = "gpt-6-luna"
enabled = true
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50

[[models]]
name = "gpt-5-4-mini"
provider = "openai"
model = "gpt-5.4-mini"
enabled = true
price_input_per_mtok = 0.75
price_output_per_mtok = 4.50

[[models]]
name = "groq-qwen3-8-27b"
provider = "groq"
model = "qwen/qwen3.8-27b"
enabled = false   # plan gratuito de Groq: 1.000 tokens de salida/min, no alcanza para una auditoría
temperature = 0
max_tokens = 16000   # el default de Groq corta la respuesta

[[models]]
name = "groq-gpt-oss-120b"
provider = "groq"
model = "openai/gpt-oss-120b"
enabled = true
price_input_per_mtok = 0.15
price_output_per_mtok = 0.60
temperature = 0
max_tokens = 16000
tool_mode = true   # en modo JSON intenta llamar a registrar_auditoria igual; se le da la herramienta real

