<!doctype html>
<html lang="es">
<head>

<title>Revisión capa 2</title>
<style>

  @media (prefers-color-scheme: dark) {

      --seq-0: #383835; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef;

  .jvt tr.dim th, .jvt tr.dim td { color: var(--text-2); font-weight: 400; }

  .jpre { white-space: pre-wrap; max-height: 320px; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 8px; margin: 4px 0; }

</style>
</head>
<body>
<header>
  <h1>Revisión capa 2 · llamadas reales</h1>
  <div class="tabs"><button id="t-dash" class="on">Dashboard</button><button id="t-rev">Revisión</button></div>
  <label style="font-size:13px;color:var(--text-2)">Versión del prompt <select id="ver"></select></label>
  <span id="hdrnote" style="font-size:12px;color:var(--muted)"></span>
</header>
<main>
  <section id="dash"></section>
  <section id="rev" hidden></section>
</main>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmtUsd = (v, d = 4) => v == null ? "—" : "US$" + v.toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => b ? Math.round((100 * a) / b) + "%" : "—";
const SHOW = { APROBADA: "APROBADA", RECHAZADA: "RECHAZADA", DUDOSA: "POR REVISAR", ERROR: "ERROR" };
const COLOR = {}; D.models.forEach((m, i) => COLOR[m] = `var(--s${i + 1})`);
const lab = (m) => D.labels[m] || m;
// Rechazo leve: RECHAZADA y todos los motivos incumplidos son de D.minor (lo calcula dashboard.py en minor_only).
const MINOR = new Set(D.minor || []);
const isLeve = (r) => !!r?.minor_only && r.verdict === "RECHAZADA";
const leveIds = (r) => (r?.bad || []).join(", ");
const fmtT = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const parseT = (t) => { const p = String(t || "").split(":").map(Number); return p.some(isNaN) ? null : p.reduce((a, b) => a * 60 + b, 0); };
let version = D.versions[0];
$("#ver").innerHTML = D.versions.map((v) => `<option>${esc(v)}</option>`).join("");
$("#hdrnote").textContent = `${D.calls.length} llamadas · modelos: ${D.models.map(lab).join(", ")}`;

const realCount = { APROBADA: D.calls.filter((c) => c.real === "APROBADA").length, RECHAZADA: D.calls.filter((c) => c.real === "RECHAZADA").length };

// ---------- Calce IA vs cliente ----------
// Referencia: ESTADO_CALIDAD del Excel y, si las trae, las 33 columnas CUMPLE / NO CUMPLE por criterio (client_bad).
// En las APROBADA todos los criterios se cumplen, así que un criterio marcado es falsa alarma. En las RECHAZADA sin
// columnas por criterio solo se mide el veredicto de la llamada y los criterios marcados se muestran como descripción.
const META = { fa: 0.05, om: 0.2 }; // docs/context.md: hasta 5 % de falsos positivos y 20 % de falsos negativos
const HOLD_BY_CODE = D.hold_by_code ?? true;
const TIPIF = [19, 20, 21, 22, 23, 24, 25];
const unevaluable = (c) => new Set(c.unevaluable || (c.typification ? [] : TIPIF));
// Criterios que el cliente marcó NO CUMPLE; null si no se sabe (rechazada sin columnas por criterio).
const clientBad = (c) => c.client_bad ? new Set(c.client_bad) : c.real === "APROBADA" ? new Set() : null;
const HAS_REF = D.calls.some((c) => c.real === "RECHAZADA" && c.client_bad);
const NO_REF = D.calls.some((c) => !clientBad(c));
const UI = { metric: "bal", revAsRej: true, k: 2, mapSeries: null };
try { Object.assign(UI, JSON.parse(localStorage.getItem("l2-calce") || "{}")); } catch {}
const saveUi = () => { try { localStorage.setItem("l2-calce", JSON.stringify(UI)); } catch {} };
const p0 = (v) => v == null || isNaN(v) ? "—" : Math.round(100 * v) + "%";
const p1 = (v) => v == null || isNaN(v) ? "—" : (100 * v).toLocaleString("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const METRICS = {
  bal: { name: "Calce equilibrado", val: (s) => (s.det + 1 - s.fa) / 2, hi: true },
  det: { name: "Detección de rechazadas", val: (s) => s.det, hi: true, goal: 1 - META.om },
  fa: { name: "Falsas alarmas", val: (s) => s.fa, hi: false, goal: META.fa },
  agree: { name: "Concordancia simple", val: (s) => s.agree, hi: true },
};

// "R" rechaza, "A" aprueba, null = sin resultado (error o no corrió). Una llamada "por revisar" llega igual a un
// auditor: por defecto cuenta como rechazo.
function decided(r) {
  if (!r || !r.verdict || r.verdict === "ERROR") return null;
  if (r.verdict === "RECHAZADA") return "R";
  if (r.verdict === "DUDOSA") return UI.revAsRej ? "R" : "A";
  return "A";
}

// Serie = un modelo o el consenso "k de N". get(c) devuelve { d, bad, rev, cost, latency } o null.
function seriesList() {
  const models = D.models.filter((m) => D.calls.some((c) => c.results[version]?.[m]?.verdict));
  const list = models.map((m) => ({
    id: m, name: lab(m), color: COLOR[m],
    get: (c) => { const r = c.results[version]?.[m], d = decided(r); return d && { d, bad: r.bad || [], rev: r.verdict === "DUDOSA", cost: r.cost, latency: r.latency }; },
  }));
  if (models.length > 1) {
    const k = Math.min(Math.max(1, UI.k), models.length);
    list.push({
      id: "cons", name: `Consenso ${k} de ${models.length}`, color: "var(--muted)", cons: true,
      get: (c) => {
        const rs = models.map((m) => c.results[version]?.[m]).filter((r) => decided(r));
        if (rs.length < models.length) return null; // sin el voto de todos, el consenso no es comparable
        const votes = {};
        rs.forEach((r) => (r.bad || []).forEach((id) => (votes[id] = (votes[id] || 0) + 1)));
        const sum = (f) => rs.every((r) => r[f] != null) ? rs.reduce((a, r) => a + r[f], 0) : null;
        return { d: rs.filter((r) => decided(r) === "R").length >= k ? "R" : "A", bad: Object.keys(votes).filter((id) => votes[id] >= k).map(Number),
          rev: false, cost: sum("cost"), latency: rs.every((r) => r.latency != null) ? Math.max(...rs.map((r) => r.latency)) : null };
      },
    });
  }
  return list;
}

function callStats(se) {
  const s = { A: { n: 0, R: 0, rev: 0 }, R: { n: 0, R: 0, rev: 0 }, excl: 0, cost: 0, costN: 0, lat: 0, latN: 0 };
  for (const c of D.calls) {
    const r = se.get(c);
    if (!r) { s.excl++; continue; }
    const g = s[c.real === "RECHAZADA" ? "R" : "A"];
    g.n++; g.R += r.d === "R"; g.rev += r.rev;
    if (r.cost != null) { s.cost += r.cost; s.costN++; }
    if (r.latency != null) { s.lat += r.latency; s.latN++; }
  }
  s.det = s.R.n ? s.R.R / s.R.n : NaN;
  s.fa = s.A.n ? s.A.R / s.A.n : NaN;
  s.agree = s.A.n + s.R.n ? (s.R.R + s.A.n - s.A.R) / (s.A.n + s.R.n) : NaN;
  s.perCall = s.costN ? s.cost / s.costN : null;
  return s;
}

function criteriaTable(series) {
  const ids = Object.keys(D.criteria).map(Number).sort((a, b) => a - b);
  // count[id][serie]: A = marcado en aprobadas (falsa alarma); R = marcado en rechazadas; hit = marcado y el cliente
  // también; ref = el cliente lo marcó (denominador de la detección); extra = marcado en una rechazada y el cliente no.
  // den[id][serie] = aprobadas donde se evalúa.
  const count = {}, den = {};
  for (const id of ids) { count[id] = {}; den[id] = {}; }
  for (const x of series) for (const c of D.calls) {
    const r = x.get(c);
    if (!r) continue;
    const skip = unevaluable(c), side = c.real === "RECHAZADA" ? "R" : "A", ref = clientBad(c);
    for (const id of ids) {
      const k = count[id][x.id] ||= { A: 0, R: 0, hit: 0, ref: 0, extra: 0 };
      const on = r.bad.includes(id);
      if (side === "R" && ref?.has(id)) { k.ref++; k.hit += on; }
      if (skip.has(id)) continue;
      if (side === "A") den[id][x.id] = (den[id][x.id] || 0) + 1;
      if (on) { k[side]++; if (side === "R" && ref && !ref.has(id)) k.extra++; }
    }
  }
  const g = (id, x, f) => count[id][x.id]?.[f] || 0;
  const used = ids.filter((id) => series.some((x) => g(id, x, "A") || g(id, x, "R") || g(id, x, "ref")));
  const unused = ids.filter((id) => !used.includes(id));
  const maxA = Math.max(1, ...used.flatMap((id) => series.map((x) => g(id, x, "A"))));
  const maxR = Math.max(1, ...used.flatMap((id) => series.map((x) => g(id, x, "R"))));
  const shade = (v, max) => { const k = v ? Math.ceil((v / max) * 4) : 0; return `background:var(--seq-${k});color:var(--seq-ink-${k})`; };
  const head = (x) => `<th>${x.cons ? "" : `<span class="dot" style="display:inline-block;background:${x.color}"></span><br>`}${esc(x.name)}</th>`;
  // Veces que el cliente marcó el criterio en rechazadas (igual para todas las series salvo llamadas sin resultado).
  const refN = (id) => D.calls.filter((c) => c.real === "RECHAZADA" && clientBad(c)?.has(id)).length;
  let h = `<div class="card"><h3>¿En qué criterios se equivoca cada opción?</h3>
    <p class="note">Una fila por criterio marcado alguna vez${HAS_REF ? " por la IA o por el cliente" : ""}. <b>Izquierda:</b> en cuántas llamadas aprobadas por el cliente la IA marca el criterio; cada una es una falsa alarma y el recuadro marca a la opción con menos. <b>Derecha:</b> ${HAS_REF
      ? "en las rechazadas, cuántas veces el cliente marcó el criterio NO CUMPLE y cuántas de esas detectó cada opción; el recuadro marca a la que detecta más. El detalle de cada celda dice además en cuántas rechazadas la IA lo marca y el cliente no."
      : "en cuántas rechazadas lo marca; es solo descriptivo, porque el Excel no dice qué criterio falló."}</p>
    <div class="wrap"><table class="hm"><thead><tr><th></th><th class="grp" colspan="${series.length}">En aprobadas · falsas alarmas</th><th class="gap"></th>${HAS_REF
      ? `<th class="grp" colspan="${series.length + 1}">En rechazadas · incumplimientos detectados</th>`
      : `<th class="grp" colspan="${series.length}">En rechazadas · marcado, sin referencia</th>`}</tr>
    <tr><th></th>${series.map(head).join("")}<th class="gap"></th>${HAS_REF ? `<th>Cliente</th>` : ""}${series.map(head).join("")}</tr></thead><tbody>`;
  for (const id of used) {
    const fa = series.map((x) => g(id, x, "A")), lo = Math.min(...fa), clear = fa.some((v) => v !== lo);
    const tags = (HOLD_BY_CODE && id === 1 ? `<span class="tag" title="Lo calcula el código desde las esperas detectadas: es igual en todos los modelos">código</span>` : "")
      + (MINOR.has(id) ? `<span class="tag" title="Motivo leve">leve</span>` : "")
      + (TIPIF.includes(id) && D.calls.some((c) => unevaluable(c).has(id)) ? `<span class="tag" title="No se evalúa en llamadas sin tipificación">parcial</span>` : "");
    const crit = `${id}. ${esc(D.criteria[id])}`;
    h += `<tr><td class="cid" title="${esc(`${id}. ${D.criteria[id]}`)}">${crit}${tags}</td>`
      + series.map((x, i) => { const v = fa[i], n = den[id][x.id] || 0; return `<td class="cell${clear && v === lo ? " best" : ""}" style="${shade(v, maxA)}" data-tip="${esc(x.name)} · ${crit}<br>Marcado en <b>${v} de ${n}</b> aprobadas (${p0(n ? v / n : NaN)})">${v}</td>`; }).join("")
      + `<td class="gap"></td>`;
    if (HAS_REF) {
      const n = refN(id), hits = series.map((x) => g(id, x, "hit")), hi = Math.max(...hits), clearR = hits.some((v) => v !== hi);
      h += `<td class="cell" style="color:var(--text-2)" data-tip="${crit}<br>El cliente lo marcó NO CUMPLE en <b>${n}</b> llamadas rechazadas">${n}</td>`
        + series.map((x, i) => {
          const k = count[id][x.id] || {}, v = hits[i], d = k.ref || 0, extra = k.extra || 0;
          const tip = `${esc(x.name)} · ${crit}<br>${d ? `Detecta <b>${v} de ${d}</b> incumplimientos del cliente (${p0(v / d)})` : "El cliente no lo marcó en ninguna rechazada"}`
            + (extra ? `<br>Además lo marca en <b>${extra}</b> rechazada${extra > 1 ? "s" : ""} donde el cliente no lo marcó` : "");
          const label = d ? `${v}` : "—", sup = extra ? `<sup>+${extra}</sup>` : "";
          return `<td class="cell${d && clearR && v === hi ? " best" : ""}" style="${shade(d ? Math.round((4 * v) / d) : 0, 4)}" data-tip="${tip}">${label}${sup}</td>`;
        }).join("");
    } else {
      h += series.map((x) => { const v = g(id, x, "R"); return `<td class="cell" style="${shade(v, maxR)}" data-tip="${esc(x.name)} · ${crit}<br>Marcado en <b>${v}</b> llamadas rechazadas">${v}</td>`; }).join("");
    }
    h += `</tr>`;
  }
  if (HAS_REF) {
    // Totales: falsas alarmas de criterio en aprobadas; detección sobre todas las marcas del cliente.
    const sum = (x, f) => used.reduce((a, id) => a + g(id, x, f), 0), nTot = used.reduce((a, id) => a + refN(id), 0);
    h += `<tr><td class="cid"><b>Total</b></td>${series.map((x) => `<td class="cell" data-tip="${esc(x.name)}<br>${sum(x, "A")} criterios marcados en aprobadas">${sum(x, "A")}</td>`).join("")}<td class="gap"></td>`
      + `<td class="cell" style="color:var(--text-2)" data-tip="Marcas NO CUMPLE del cliente en rechazadas">${nTot}</td>`
      + series.map((x) => { const v = sum(x, "hit"), d = sum(x, "ref"), e = sum(x, "extra"); return `<td class="cell" data-tip="${esc(x.name)}<br>Detecta <b>${v} de ${d}</b> incumplimientos del cliente (${p0(d ? v / d : NaN)})<br>Marca <b>${e}</b> criterios de más en rechazadas">${p0(d ? v / d : NaN)}${e ? `<sup>+${e}</sup>` : ""}</td>`; }).join("")
      + `</tr>`;
  }
  h += `</tbody></table></div>`;
  if (HAS_REF) h += `<p class="note" style="margin-top:8px">En la fila Total, a la derecha va el porcentaje de detección. <sup>+n</sup>: veces que la opción marca el criterio en una rechazada donde el cliente no lo marcó.</p>`;

function errorMap(se) {
  const wrap = $("#mapwrap");
  if (!se) { wrap.innerHTML = ""; return; }
  const byId = (a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
  const appr = D.calls.filter((c) => c.real === "APROBADA").sort(byId), rej = D.calls.filter((c) => c.real === "RECHAZADA").sort(byId);
  const ids = Object.keys(D.criteria).map(Number).sort((a, b) => a - b);
  const cs = 10, gap = 1, labelW = 48, sepW = 12, top = 30, vRow = 16;
  const x0 = (i) => labelW + i * (cs + gap) + (i >= appr.length ? sepW : 0);
  const W = x0(appr.length + rej.length), H = top + vRow + ids.length * (cs + gap);
  const fill = (state) => ({ ok: "var(--good)", miss: "var(--crit)", fa: "var(--warn)", mark: "var(--accent)", none: "var(--grid)" })[state];
  let svg = `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de criterios marcados por ${esc(se.name)} en cada llamada">`;
  svg += `<text x="${labelW}" y="10">Aprobadas por el cliente (${appr.length})</text><text x="${x0(appr.length)}" y="10">Rechazadas por el cliente (${rej.length})</text>`;
  svg += `<rect x="${labelW}" y="15" width="${x0(appr.length - 1) + cs - labelW}" height="3" rx="1.5" fill="var(--axis)"/><rect x="${x0(appr.length)}" y="15" width="${W - x0(appr.length)}" height="3" rx="1.5" fill="var(--axis)"/>`;
  svg += `<text x="0" y="${top + 9}">Veredicto</text>`;
  ids.forEach((id, j) => { if (id === 1 || id % 4 === 1) svg += `<text x="0" y="${top + vRow + j * (cs + gap) + 8}">C${String(id).padStart(2, "0")}</text>`; });
  [...appr, ...rej].forEach((c, i) => {
    const x = x0(i), r = se.get(c), rejected = c.real === "RECHAZADA", skip = unevaluable(c), ref = clientBad(c);
    const vs = !r ? null : rejected ? (r.d === "R" ? "ok" : "miss") : (r.d === "R" ? "fa" : "ok");
    const vLabel = !r ? "sin resultado" : { ok: "veredicto correcto", miss: "la IA aprueba una llamada rechazada", fa: "falsa alarma" }[vs] + (r.rev ? " (por revisar)" : "");
    svg += `<rect data-s="${c.stem}" x="${x}" y="${top}" width="${cs}" height="${cs + 2}" rx="2" fill="${vs ? fill(vs) : "transparent"}" stroke="${vs ? "none" : "var(--grid)"}" data-tip="Llamada ${esc(c.id)} · cliente: ${c.real}<br>${esc(se.name)}: ${vLabel}"/>`;
    ids.forEach((id, j) => {
      const y = top + vRow + j * (cs + gap);
      const cl = ref?.has(id);
      if (!r || (skip.has(id) && !cl)) { svg += `<rect data-s="${c.stem}" x="${x + 0.5}" y="${y + 0.5}" width="${cs - 1}" height="${cs - 1}" fill="none" stroke="var(--grid)" stroke-width="0.6"/>`; return; }
      const on = r.bad.includes(id);
      const state = !ref ? (on ? "mark" : "none") : on ? (cl ? "ok" : "fa") : cl ? "miss" : "none";
      const why = { ok: "Acierto: el cliente y la IA lo marcan", miss: skip.has(id) ? "El cliente lo marca; la IA no lo evalúa (llamada sin tipificación)" : "El cliente lo marca y la IA no lo detecta",
        fa: rejected ? "Falsa alarma: la IA lo marca y el cliente no" : "Falsa alarma", mark: "La IA lo marca (sin referencia)" }[state];
      svg += `<rect data-s="${c.stem}" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="1.5" fill="${fill(state)}"${why ? ` data-tip="Llamada ${esc(c.id)} · cliente: ${c.real}<br>${id}. ${esc(D.criteria[id])}<br>${why}"` : ""}/>`;
    });
  });
  wrap.innerHTML = svg + "</svg>";
  wrap.onclick = (e) => { const t = e.target.closest("[data-s]"); if (!t) return; show("rev"); openCall(t.dataset.s); document.querySelector(`#list tr[data-s="${t.dataset.s}"]`)?.scrollIntoView({ block: "nearest" }); };
}

const REVIEW_DIR = decodeURIComponent(location.pathname.replace(/\/[^/]*$/, "")).replace(/^\//, "");
let serverSave = false, saveTimer = null;
const motivesToCsv = (m) => Object.entries(m || {}).sort((a, b) => a[0] - b[0]).map(([id, x]) => `${id}=${x.v}/${x.blind ? "ciego" : "visto"}`).join(";");
const motivesFromCsv = (s) => Object.fromEntries(String(s || "").split(";").filter(Boolean).map((part) => {
  const [id, rest = ""] = part.split("="), [v, how] = rest.split("/");
  return [id, { v, blind: how === "ciego", at: "" }];
}));
const csvColumns = () => ["stem", "llamada", "grabacion", "excel", "mi_veredicto", ...D.models.map((m) => `acerto_${m}`), "nota", "revisado_en", ...(J ? ["motivos_etiquetados"] : []),
  ...D.versions.flatMap((v) => D.models.flatMap((m) => [`ia_${m}_${v}`, `ia_${m}_${v}_solo_leves`]))];
const csvRows = () => D.calls.filter((c) => reviews[c.stem]).map((c) => {
  const r = reviews[c.stem];
  return [c.stem, c.id, c.recording, c.real, r.verdict === "DUDOSA" ? "POR REVISAR" : r.verdict || "",
    ...D.models.map((m) => ({ ok: "si", bad: "no" })[r.models?.[m]] || ""), r.note || "", r.at || "", ...(J ? [motivesToCsv(r.motives)] : []),
    ...D.versions.flatMap((v) => D.models.flatMap((m) => [c.results[v]?.[m]?.verdict || "", isLeve(c.results[v]?.[m]) ? "si" : ""]))];

function setSaveState(text, warn = false) { const el = $("#savestate"); if (el) { el.textContent = text; el.style.color = warn ? "var(--bad, #c0392b)" : "var(--muted)"; } }
async function pushServer() {
  try {
    const res = await fetch(`/api/review?dir=${encodeURIComponent(REVIEW_DIR)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ columns: csvColumns(), rows: csvRows() }) });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    setSaveState(`Guardado en ${j.file} (${j.rows} revisadas) · ${new Date().toLocaleTimeString()}`);
  } catch (e) { setSaveState("No se pudo guardar el CSV: quedó solo en este navegador", true); }
}
const saveReviews = () => {
  try { localStorage.setItem(STORE, JSON.stringify(reviews)); } catch {}
  if (serverSave) { clearTimeout(saveTimer); setSaveState("Guardando…"); saveTimer = setTimeout(pushServer, 600); }
};
async function loadServerReviews() {
  try {
    const res = await fetch(`/api/review?dir=${encodeURIComponent(REVIEW_DIR)}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const { rows, file } = await res.json();
    serverSave = true;
    let localOnly = false;
    const fromCsv = {};
    for (const row of rows) {
      if (!row.stem) continue;
      fromCsv[row.stem] = {
        verdict: row.mi_veredicto === "POR REVISAR" ? "DUDOSA" : row.mi_veredicto || null,
        models: Object.fromEntries(D.models.map((m) => [m, ({ si: "ok", no: "bad" })[row[`acerto_${m}`]] || ""])),
        note: row.nota || "", at: row.revisado_en || "",
        ...(row.motivos_etiquetados ? { motives: motivesFromCsv(row.motivos_etiquetados) } : {}),
      };
    }
    // Gana la revisión más reciente de cada llamada (CSV o navegador); las que solo estaban en el navegador se suben.
    for (const stem of new Set([...Object.keys(fromCsv), ...Object.keys(reviews)])) {
      const a = fromCsv[stem], b = reviews[stem];
      if (!b || (a && (a.at || "") >= (b.at || ""))) reviews[stem] = a;
      else if (D.calls.some((c) => c.stem === stem) && (!a || (b.at || "") > (a.at || ""))) localOnly = true;
    }
    try { localStorage.setItem(STORE, JSON.stringify(reviews)); } catch {}
    setSaveState(`Revisión en ${file} (${rows.length} filas)`);
    if (localOnly) await pushServer();
  } catch { setSaveState("Sin review_server.py: la revisión queda solo en este navegador (usa Exportar)", true); }
}

    const a = r.audit, info = a.informacion_seguro || {};
    h += `<p style="font-size:13px"><b>Resumen:</b> ${esc(a.resumen)}</p>`;
    if (info.estado && info.estado !== "OK") h += `<p style="font-size:13px"><span class="chip DUDOSA">${info.estado === "SIN_FICHA" ? "Sin información del seguro" : "La ficha no corresponde"}</span> ${esc(info.comentario)}</p>`;
    for (const g of a.gestiones || []) h += `<p class="note">Según la grabación: <b>${esc(g.resultado_grabacion)}</b> · objeciones: ${esc(g.n_objeciones)} · motivos del cliente: ${esc((g.motivos_renuncia || []).join(", ") || "—")}</p>`;
    const order = { incumple: 0, indeterminado: 1, cumple: 2, no_aplica: 3 };
    // Dentro de cada estado, los graves antes que los leves.
    const crit = [...(a.criterios || [])].sort((x, y) => (order[x.estado] ?? 9) - (order[y.estado] ?? 9) || MINOR.has(x.id) - MINOR.has(y.id) || x.id - y.id);
    if (isLeve(r)) h += `<p class="levenote"><span class="chip RECHAZADA leve">RECHAZADA · SOLO LEVES</span> Esta IA rechazó solo por motivos leves (${leveIds(r)}). Revisa si alguno basta para rechazar la llamada.</p>`;
    const block = (cr) => {
      const cls = cr.estado === "incumple" ? "RECHAZADA" : cr.estado === "indeterminado" ? "DUDOSA" : "APROBADA";
      const ev = (cr.evidencia || []).map((e) => { const s = parseT(e.t); return `<div class="ev">${s != null ? `<span class="ts" data-seek="${s}">${esc(e.t)}</span>` : esc(e.t || "")} ${esc(e.hablante)}: “${esc(e.cita)}”</div>`; }).join("");
      const leve = (MINOR.has(cr.id) ? ` <span class="chip NONE" title="Motivo leve: por sí solo marca la llamada para revisión">leve</span>` : "")
        + (c.client_bad?.includes(cr.id) ? ` <span class="chip RECHAZADA" title="El auditor del cliente marcó este criterio NO CUMPLE">cliente: no cumple</span>` : "");
      // Segunda opinión Jev: una vez por motivo (un motivo puede repetirse por seguro), solo en la versión de Jev.
      const jev = jevHere && version === J.version && cr.estado === "incumple" && jPairs(c.stem)[cr.id] && !jevDone.has(cr.id) ? (jevDone.add(cr.id), jevSection(c, cr.id)) : "";
      return `<div class="crit"><span class="chip ${cls}">${esc(cr.estado)}</span>${leve} <b>${cr.id}. ${esc(D.criteria[cr.id] || "")}</b> <small style="color:var(--muted)">confianza ${esc(cr.confianza)}</small><div class="c">${esc(cr.comentario)}</div>${ev}${jev}</div>`;
    };
    const main = crit.filter((x) => x.estado === "incumple" || x.estado === "indeterminado");
    h += main.length ? main.map(block).join("") : `<p class="note">Sin motivos incumplidos ni indeterminados.</p>`;
    const rest = crit.filter((x) => !main.includes(x));
    h += `<details><summary>Ver los ${rest.length} motivos que cumple o no aplican</summary>${rest.map(block).join("")}</details>`;
  }
  $("#mres").innerHTML = h;
  $("#mres").onclick = (e) => { const t = e.target.closest("[data-seek]"); if (t) seek(+t.dataset.seek, true); };
  if (J) bindJev(c);
}

async function loadAudio(c) {
  const player = $("#player");
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  if (!c.audio) {
    // Dashboard compartido con share_dashboard.py --no-audio: solo transcripciones.
    player.removeAttribute("src");
    player.style.display = "none";
    document.querySelectorAll(".spd").forEach((b) => (b.style.display = "none"));
    $("#astate").textContent = "Esta versión no incluye audios: solo la transcripción.";
    return;
  }
  if (/^https?:/.test(c.audio)) {
    // URL prefirmada de S3 (share_dashboard.py): S3 soporta Range, así que se reproduce directo y sin CORS.
    player.src = c.audio;
    player.onerror = () => { if (current === c) $("#astate").textContent = "No se pudo cargar el audio: el enlace pudo haber vencido. Pide un dashboard nuevo."; };
    $("#astate").textContent = "";
  } else try {
    // Se carga como blob: así se puede saltar a cualquier punto aunque el servidor no soporte Range.
    const res = await fetch(c.audio);
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    if (current !== c) return;
    audioUrl = URL.createObjectURL(new Blob([blob], { type: "audio/wav" }));
    player.src = audioUrl;
    $("#astate").textContent = "";
  } catch {
    player.src = c.audio;
    $("#astate").textContent = "Abre la página con el servidor local para escuchar el audio.";
  }
  let last = -1;
  player.ontimeupdate = () => { const s = Math.floor(player.currentTime); if (s !== last) { last = s; syncTranscript(player.currentTime); } };
}

function seek(sec, highlight) {
  const p = $("#player");
  if (!p) return;
  p.currentTime = Math.max(0, sec - 1);
  p.play().catch(() => {});
  if (highlight) {
    document.querySelectorAll(".turn.hl").forEach((x) => x.classList.remove("hl"));
    const turns = [...document.querySelectorAll(".turn")];
    const t = turns.filter((x) => +x.dataset.t <= sec + 1).pop();
    if (t) { t.classList.add("hl"); t.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
}

function syncTranscript(t) {
  const turns = [...document.querySelectorAll(".turn")];
  let on = null;
  for (const el of turns) { el.classList.remove("on"); if (+el.dataset.t <= t + 0.5) on = el; }
  if (on) { on.classList.add("on"); const box = $("#tr"); if (!$("#player").paused) box.scrollTo({ top: on.offsetTop - box.offsetTop - box.clientHeight / 3, behavior: "smooth" }); }
}

function step(d) {
  if (!filtered.length) return;
  const i = filtered.findIndex((c) => c.stem === current?.stem);
  const n = filtered[Math.min(filtered.length - 1, Math.max(0, i + d))];
  if (n) { openCall(n.stem); document.querySelector(`#list tr[data-s="${n.stem}"]`)?.scrollIntoView({ block: "nearest" }); }
}

document.addEventListener("keydown", (e) => {
  if ($("#rev").hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "j") step(1);
  if (e.key === "k") step(-1);
  if (e.key === " " && $("#player")) { e.preventDefault(); const p = $("#player"); p.paused ? p.play() : p.pause(); }
});

function exportCsv() {
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [csvColumns().map(q).join(",")].concat(csvRows().map((row) => row.map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `revision_capa2_${version}.csv`;
  a.click();
}

// ---------- Segunda opinión Jev (D.jev, de jev_review.py) ----------
// Jev respondió, para cada motivo que el modelo fuente marcó en llamadas que el Excel aprobó, una pregunta de opciones
// (incumple / cumple / no aplica, con su confianza) y una sí/no (p de incumplimiento). "Cumple" y "no aplica", o p bajo
// el umbral, revierten el rechazo. La etiqueta del par ("¿El ejecutivo incumple el motivo?") vive en
// reviews[stem].motives y se guarda en la columna motivos_etiquetados del CSV.
// Spec: docs/ux/calce-ia-vs-humano/jev-segunda-opinion/07-especificacion.md (§4, §8 y §9).
const J = D.jev || null;
const JV = J ? Object.fromEntries(J.variants.map((v) => [v.key, v])) : {};
const LANG = { es: "español", en: "inglés" };
const TYPE = { choice: "opciones", yesno: "sí/no" };
const MODE = { blind: "ciego", finding: "con hallazgo" };
const OPT = { incumple: "incumple", cumple: "cumple", no_aplica: "no aplica" };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const pctJ = (x) => `${Math.round(100 * x)} %`;
const fmtP = (p) => p.toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const jevName = (k, withMode = true) => { const v = JV[k]; return `${v.model} · ${LANG[v.lang] || v.lang} · ${TYPE[v.type]}${withMode ? ` · ${MODE[v.mode]}` : ""}`; };
const jGroup = (mode, type) => J.variants.filter((v) => v.mode === mode && v.type === type);
const jPairs = (stem) => J?.pairs[stem] || null;
const jIds = (stem) => Object.keys(jPairs(stem) || {}).map(Number).sort((a, b) => a - b);
const jCell = (stem, id, key) => jPairs(stem)?.[id]?.[key] ?? null;
// ¿Jev confirma el rechazo? null si no respondió.
const jConfirms = (stem, id, key) => {
  const cell = jCell(stem, id, key);
  return cell == null ? null : JV[key].type === "choice" ? cell.choice === "incumple" : cell.p >= J.threshold;
};
const jReverts = (stem, id, key) => jConfirms(stem, id, key) === false;
// Decisión poco segura: confianza bajo low_conf (opciones) o p cerca del umbral (sí/no).
const jUnsure = (stem, id, key) => {
  const cell = jCell(stem, id, key);
  if (cell == null) return false;
  return JV[key].type === "choice" ? cell.conf < J.low_conf : cell.p >= J.near[0] && cell.p < J.near[1];
};
const tagOf = (stem, id) => reviews[stem]?.motives?.[id]?.v || "";
const jevShown = new Set(); // "stem|id" revelados con "Mostrar igual"
const jevOpen = new Set(); // <details> abiertos del bloque Jev, para conservarlos al re-renderizar
const jevPromptSel = {}; // "stem|id" → { lang, mode, type } elegidos en "Ver la pregunta enviada a Jev"
let jevHide = true;
try { jevHide = localStorage.getItem("l2-jev-hide") !== "0"; } catch {}

// Con la variante `key`, ¿todos los motivos de la llamada se revierten y no hay otros incumplidos (el 1 lo calcula el
// código)? Con strict, además la llamada tiene que pasar a "aprueba" con la misma regla de la matriz 2×2 (si le quedan
// indeterminados o la ficha no sirve, queda por revisar).
function jevRescued(c, key, strict = false) {
  const ids = jIds(c.stem);
  if (!ids.length || !ids.every((id) => jReverts(c.stem, id, key))) return false;
  if ((J.calls[c.stem]?.bad || []).some((id) => !ids.includes(id))) return false;
  if (!strict) return true;
  const r = c.results[J.version]?.[J.source];
  const would = r?.unsure?.length || (r?.info && r.info !== "OK") ? "DUDOSA" : "APROBADA";
  return decided({ verdict: would }) === "A";
}

function jevMatch(c, f) {
  const ids = jIds(c.stem), k = J.main;
  if (!ids.length) return false;
  if (f === "with") return true;
  if (f === "rev") return ids.some((id) => jReverts(c.stem, id, k));
  if (f === "conf") return ids.every((id) => jConfirms(c.stem, id, k) === true);
  if (f === "unsure") return ids.some((id) => jUnsure(c.stem, id, k));
  if (f === "pending") return ids.some((id) => !tagOf(c.stem, id));
  if (f === "contra") return ids.some((id) => { const t = tagOf(c.stem, id), cf = jConfirms(c.stem, id, k); return (t === "si" || t === "no") && cf != null && cf !== (t === "si"); });
  return true;
}
function jevFilterOptions() {
  const n = (f) => D.calls.filter((c) => jevMatch(c, f)).length;
  return [["", "Jev: todas"], ["with", `Con opinión de Jev (${n("with")})`], ["rev", `Jev revierte algún motivo (${n("rev")})`],
    ["conf", `Jev confirma todos los motivos (${n("conf")})`], ["unsure", `Jev con decisión poco segura (${n("unsure")})`],
    ["pending", `Motivos sin etiquetar (${n("pending")})`], ["contra", `Jev contradice mi etiqueta (${n("contra")})`]]
    .map(([v, t]) => `<option value="${v}"${F.jev === v ? " selected" : ""}>${t}</option>`).join("");
}
const jevTotals = () => { const all = D.calls.flatMap((c) => jIds(c.stem).map((id) => tagOf(c.stem, id))); return { n: all.length, k: all.filter(Boolean).length }; };
function jevMark(c) {
  const ids = J ? jIds(c.stem) : [];
  if (!ids.length) return "";
  const k = J.main, r = ids.filter((id) => jReverts(c.stem, id, k)).length, cf = ids.filter((id) => jConfirms(c.stem, id, k) === true).length;
  const confs = JV[k].type === "choice" ? ids.map((id) => jCell(c.stem, id, k)?.conf).filter((x) => x != null) : [];
  return `<div class="rv" title="Variante principal (${esc(jevName(k))}), prompt ${esc(J.version)}">Jev: ${r ? `revierte ${r} de ${ids.length}` : `confirma ${cf} de ${ids.length}`}${confs.length ? ` · confianza mín. ${pctJ(Math.min(...confs))}` : ""}</div>`;
}

// Grilla modelo × idioma de un grupo de variantes (mismo modo y tipo de pregunta).
function jevGrid(stem, id, vs, caption, legId) {
  const models = [...new Set(vs.map((v) => v.model))], langs = [...new Set(vs.map((v) => v.lang))];
  const cell = (v) => {
    if (!v) return "<td>—</td>";
    const c = jCell(stem, id, v.key);
    if (c == null) return `<td title="Jev no respondió en esta variante">— · sin respuesta</td>`;
    const rv = jReverts(stem, id, v.key), main = v.key === J.main, un = jUnsure(stem, id, v.key);
    const text = v.type === "choice" ? `${OPT[c.choice] || c.choice} · ${pctJ(c.conf)}` : `p = ${fmtP(c.p)} · ${rv ? "revierte" : "confirma"}`;
    const srText = un ? (v.type === "choice" ? " (decisión poco segura)" : " (cerca del umbral)") : "";
    return `<td class="${main ? "main" : ""}"${main ? ` aria-describedby="${legId}"` : ""}><span class="chip ${rv ? "APROBADA" : "RECHAZADA"}${un ? " near" : ""}">${text}${main ? " ★" : ""}</span>${srText ? `<span class="sr">${srText}</span>` : ""}</td>`;
  };
  return `<table class="jgrid"><caption>${caption}</caption><tr><td></td>${langs.map((l) => `<th scope="col">${cap(LANG[l] || l)}</th>`).join("")}</tr>`
    + models.map((m) => `<tr><th scope="row">${esc(m)}</th>${langs.map((l) => cell(vs.find((v) => v.model === m && v.lang === l))).join("")}</tr>`).join("") + `</table>`;
}

// Probabilidad de cada opción, por variante de la pregunta de opciones.
function jevProbs(stem, id) {
  const opts = ["incumple", "cumple", "no_aplica"];
  const rows = (vs) => vs.map((v) => {
    const c = jCell(stem, id, v.key);
    if (c == null) return `<tr><th scope="row">${esc(jevName(v.key, false))}</th><td class="n" colspan="5">— · sin respuesta</td></tr>`;
    return `<tr><th scope="row">${esc(jevName(v.key, false))}${v.key === J.main ? " ★" : ""}</th>${opts.map((o) => `<td class="n">${o === c.choice ? `<b>${(c.probs?.[o] == null ? "—" : pctJ(c.probs[o]))} (elige)</b>` : (c.probs?.[o] == null ? "—" : pctJ(c.probs[o]))}</td>`).join("")}<td>${OPT[c.choice] || c.choice}</td><td class="n">${pctJ(c.conf)}</td></tr>`;
  }).join("");
  const blind = jGroup("blind", "choice"), finding = jGroup("finding", "choice");
  return `<div class="wrap" tabindex="0" role="region" aria-label="Probabilidad que asigna Jev a cada opción"><table class="jgrid jprobs"><caption>Probabilidad que asigna Jev a cada opción</caption>
    <tr><td></td>${["Incumple", "Cumple", "No aplica", "Elige", "Confianza"].map((t) => `<th scope="col">${t}</th>`).join("")}</tr>
    <tr><th colspan="6" scope="rowgroup">Ciego</th></tr>${rows(blind)}
    ${finding.length ? `<tr><th colspan="6" scope="rowgroup">Con el hallazgo de Gemini (no es independiente)</th></tr>${rows(finding)}` : ""}</table></div>
    <p class="leg">La confianza la entrega Jev aparte y puede no coincidir con la probabilidad de la opción elegida.</p>`;
}

function jevHitLine(stem, id, tag) {
  if (!tag) return "";
  if (tag === "nose") return "Sin etiqueta concluyente: no se calcula acierto.";
  const truth = tag === "si";
  const score = (vs) => { const ans = vs.filter((v) => jConfirms(stem, id, v.key) != null); return [ans.filter((v) => jConfirms(stem, id, v.key) === truth).length, ans.length]; };
  const parts = [];
  for (const type of ["choice", "yesno"]) {
    const vs = jGroup("blind", type);
    if (vs.length) { const [a, n] = score(vs); parts.push(`${TYPE[type]} ciego ${a} de ${n}`); }
  }
  const main = jConfirms(stem, id, J.main);
  return `Con tu etiqueta: acierta ${parts.join(" · ")} · principal ${main === truth ? "acierta" : "falla"} · ${esc(lab(J.source))} ${truth ? "acierta" : "falla"}.`;
}

// "Ver la pregunta enviada a Jev": instrucciones exactas de la variante elegida, sin el state (está en pantalla).
function jevPromptText(stem, id, sel) {
  const P = J.prompts?.[stem]?.[id] || {}, k = `${sel.type}|${sel.lang}|${sel.mode}`;
  return J.prompts_by_model ? P[`${sel.model}|${k}`] : P[k];
}
function jevPromptBody(stem, id) {
  const sel = jevPromptSel[`${stem}|${id}`], text = jevPromptText(stem, id, sel);
  const opts = (sel.type === "choice" ? J.options : J.outcomes)?.[sel.lang] || [];
  return `<div class="jphead"><b>Instrucciones</b> <button class="btn jcopy" data-jid="${id}"${text ? "" : " disabled"}>Copiar</button></div>
    ${text ? `<pre class="jpre" tabindex="0" aria-label="Instrucciones enviadas a Jev, ${LANG[sel.lang]}, ${MODE[sel.mode]}, pregunta de ${TYPE[sel.type]}">${esc(text)}</pre>` : `<p class="note">No quedó registrada la pregunta de esta variante.</p>`}
    <p class="leg" style="margin-top:8px">${sel.type === "choice" ? "Opciones que recibió Jev:" : "Respuestas que recibió Jev (sí/no):"}</p>
    <ul class="jopts">${opts.map((o) => `<li><code>${esc(o.id)}</code> — ${esc(o.desc)}</li>`).join("")}</ul>
    <p class="note">Además, Jev recibió el prompt de la llamada (metadatos, ficha, contrato, tipificación y transcripción; unos 6.000 tokens), el mismo que recibió ${esc(lab(J.source))}. La transcripción está más abajo en esta pantalla.</p>`;
}
function jevPromptBlock(stem, id) {
  const key = `${stem}|${id}`, m = JV[J.main];
  jevPromptSel[key] ||= { lang: m.lang, mode: m.mode, type: m.type, model: m.model };
  const sel = jevPromptSel[key];
  const uniq = (f) => [...new Set(J.variants.map(f))];
  const group = (name, label, values, show) => `<fieldset class="jpsel"><legend>${label}</legend>${values.map((v) => `<label><input type="radio" class="jpr" data-jid="${id}" data-f="${name}" name="jp-${name}-${stem}-${id}" value="${esc(v)}"${sel[name] === v ? " checked" : ""}> ${esc(show(v))}</label>`).join("")}</fieldset>`;
  return `<details class="jdet" data-k="prompt-${id}"${jevOpen.has(`${key}|prompt`) ? " open" : ""}><summary>Ver la pregunta enviada a Jev</summary>
    <div class="jpsels">${group("lang", "Idioma", uniq((v) => v.lang), (v) => cap(LANG[v] || v))}${group("mode", "Modo", uniq((v) => v.mode), (v) => cap(MODE[v]))}${group("type", "Pregunta", uniq((v) => v.type), (v) => cap(TYPE[v]))}${J.prompts_by_model ? group("model", "Modelo", J.models, (v) => v) : ""}</div>
    ${J.prompts_by_model ? "" : `<p class="leg">Se usó igual con ${J.models.map(esc).join(" y ")}.</p>`}
    <div class="jpbody" id="jpbody-${id}">${jevPromptBody(stem, id)}</div></details>`;
}

function jevSection(c, id) {
  const tag = tagOf(c.stem, id), sid = `jev-${c.stem}-${id}`, key = `${c.stem}|${id}`;
  const hidden = jevHide && !tag && !jevShown.has(key);
  const bc = jGroup("blind", "choice"), by = jGroup("blind", "yesno"), fc = jGroup("finding", "choice"), fy = jGroup("finding", "yesno");
  const front = bc.length ? bc : by, folded = bc.length ? by : [];
  const det = (k, summary, body) => `<details class="jdet" data-k="${k}"${jevOpen.has(`${key}|${k}`) ? " open" : ""}><summary>${summary}</summary>${body}</details>`;
  const nConf = (vs) => vs.filter((v) => jConfirms(c.stem, id, v.key) === true).length;
  let h = `<section class="jev" aria-labelledby="${sid}"><h4 id="${sid}">Segunda opinión Jev · motivo ${id}</h4>
    <fieldset><legend>¿El ejecutivo incumple el motivo ${id}?</legend><div class="opts">${[["si", "Sí, incumple"], ["no", "No, cumple"], ["nose", "No sé"]]
      .map(([v, t]) => `<label><input type="radio" class="jtag" name="jl-${c.stem}-${id}" data-jid="${id}" value="${v}"${tag === v ? " checked" : ""}> ${t}</label>`).join("")}</div></fieldset>`;
  if (hidden) {
    h += `<p class="note" style="margin:0">La opinión de Jev aparece cuando etiquetes el motivo. <button class="btn jshow" data-jid="${id}">Mostrar igual</button></p>`;
  } else {
    const frontType = front[0]?.type;
    h += jevGrid(c.stem, id, front, `Ciego · pregunta de ${TYPE[frontType]}`, `${sid}-leg`)
      + `<p class="leg" id="${sid}-leg">★ variante principal (${esc(jevName(J.main))}) · borde punteado: decisión poco segura (opciones: confianza bajo ${pctJ(J.low_conf)}; sí/no: p entre ${fmtP(J.near[0])} y ${fmtP(J.near[1])}). Opciones: «cumple» o «no aplica» revierten el rechazo de ${esc(lab(J.source))}; «incumple» lo confirma. Sí/no: desde p = 0,5 confirma.</p>`;
    if (bc.length) h += det("probs", "Ver probabilidades por opción", jevProbs(c.stem, id));
    h += `<p class="hit">${jevHitLine(c.stem, id, tag)}</p>`;
    if (folded.length) h += det("yesno", `Pregunta sí/no, ciego (${folded.length} variantes: ${nConf(folded)} de ${folded.length} confirman)`, jevGrid(c.stem, id, folded, "Ciego · pregunta sí/no", `${sid}-leg`));
    if (fc.length || fy.length) {
      const parts = [fc.length ? `opciones ${nConf(fc)} de ${fc.length} confirman` : "", fy.length ? `sí/no ${nConf(fy)} de ${fy.length}` : ""].filter(Boolean).join(" · ");
      h += det("finding", `Con el hallazgo de Gemini (${parts}) — no es independiente`,
        `<p class="note">En este modo Jev ve el comentario y la evidencia de Gemini, y casi siempre le da la razón. Úsalo solo como referencia.</p>`
        + (fc.length ? jevGrid(c.stem, id, fc, "Con hallazgo · pregunta de opciones", `${sid}-leg`) : "")
        + (fy.length ? jevGrid(c.stem, id, fy, "Con hallazgo · pregunta sí/no", `${sid}-leg`) : ""));
    }
  }
  return h + jevPromptBlock(c.stem, id) + `</section>`;
}

function setMotive(stem, id, v) {
  const prev = reviews[stem]?.motives?.[id];
  // "ciego" = la primera etiqueta se puso sin ver a Jev; si ya estaba etiquetado, Jev estaba a la vista.
  const blind = !prev && jevHide && !jevShown.has(`${stem}|${id}`);
  setMine({ motives: { ...(reviews[stem]?.motives || {}), [id]: { v, blind, at: new Date().toISOString() } } });
}

function renderJevProgress(c) {
  const el = $("#jevprog");
  if (!el) return;
  const ids = jIds(c.stem), k = ids.filter((id) => tagOf(c.stem, id)).length;
  el.innerHTML = `Motivos con Jev: ${k} de ${ids.length} etiquetados${k < ids.length ? ` · <button class="btn" id="jevgo">Ir al motivo pendiente</button>` : ""}`;
  if ($("#jevgo")) $("#jevgo").onclick = () => {
    const id = ids.find((x) => !tagOf(c.stem, x));
    selectModel(J.source);
    const radio = document.querySelector(`#mres input.jtag[data-jid="${id}"]`);
    if (radio) { radio.closest("fieldset").scrollIntoView({ block: "center" }); radio.focus(); }
  };
}

function renderJevNote(c) {
  const el = $("#jevnote");
  if (!el) return;
  const ids = jIds(c.stem);
  if (!ids.length) { el.innerHTML = ""; return; }
  const n = ids.length, r = ids.filter((id) => jReverts(c.stem, id, J.main)).length, src = esc(lab(J.source));
  let h = `<p class="note" style="margin:6px 0"><b>Jev revisó ${n} motivo${n > 1 ? "s" : ""} que ${src} marcó como incumplido${n > 1 ? "s" : ""}.</b> Variante principal (${esc(jevName(J.main))}): revierte ${r} de ${n}.`
    + (activeModel !== J.source ? ` <button class="btn" id="jevtab">Ver en ${src}</button>` : "");
  if (jevRescued(c, J.main)) h += `<br>Con la variante principal, ${src} quedaría sin motivos incumplidos en esta llamada.`;
  if ((J.calls[c.stem]?.bad || []).includes(1)) h += `<br>Jev no evalúa el motivo 1: lo calcula el código a partir de las esperas.`;
  el.innerHTML = h + `</p>`;
  if ($("#jevtab")) $("#jevtab").onclick = () => selectModel(J.source);
}

// Enlaza los controles del bloque Jev después de cada renderModel().
function bindJev(c) {
  renderJevNote(c); renderJevProgress(c);
  if ($("#jevver2")) $("#jevver2").onclick = () => setVersion(J.version);
  const live = (t) => { if ($("#jevlive")) $("#jevlive").textContent = t; };
  document.querySelectorAll("#mres .jshow").forEach((b) => b.onclick = () => {
    jevShown.add(`${c.stem}|${b.dataset.jid}`); renderModel();
    document.querySelector(`#mres input.jtag[data-jid="${b.dataset.jid}"]`)?.focus();
  });
  document.querySelectorAll("#mres input.jtag").forEach((inp) => inp.onchange = () => {
    const id = inp.dataset.jid, dy = $(".detail")?.scrollTop;
    setMotive(c.stem, id, inp.value); renderModel();
    const line = jevHitLine(c.stem, id, inp.value);
    live(line ? `Motivo ${id}: ${line}` : "");
    if ($(".detail")) $(".detail").scrollTop = dy;
    document.querySelector(`#mres input.jtag[data-jid="${id}"][value="${inp.value}"]`)?.focus({ preventScroll: true });
  });
  document.querySelectorAll("#mres details.jdet").forEach((d) => d.ontoggle = () => {
    const id = d.closest(".jev").querySelector("input.jtag").dataset.jid, k = `${c.stem}|${id}|${d.dataset.k.startsWith("prompt") ? "prompt" : d.dataset.k}`;
    if (d.open) jevOpen.add(k); else jevOpen.delete(k);
  });
  document.querySelectorAll("#mres input.jpr").forEach((inp) => inp.onchange = () => {
    const id = inp.dataset.jid;
    jevPromptSel[`${c.stem}|${id}`][inp.dataset.f] = inp.value;
    $(`#jpbody-${id}`).innerHTML = jevPromptBody(c.stem, id);
    bindCopy();
  });
  const bindCopy = () => document.querySelectorAll("#mres .jcopy").forEach((b) => b.onclick = async () => {
    const id = b.dataset.jid, text = jevPromptText(c.stem, id, jevPromptSel[`${c.stem}|${id}`]) || "";
    try { await navigator.clipboard.writeText(text); b.textContent = "Copiado"; live(`Instrucciones del motivo ${id} copiadas`); }
    catch { b.textContent = "No se pudo copiar"; live("No se pudieron copiar las instrucciones; selecciona el texto y cópialo a mano"); }
    setTimeout(() => { b.textContent = "Copiar"; }, 2000);
  });
  bindCopy();
}

function jevCard(series, st) {
  if (!J) return "";
  const src = esc(lab(J.source)), title = `<h3>¿Sirve Jev como segunda opinión sobre ${src}?</h3>`;
  if (version !== J.version) {
    return `<div class="card" style="margin-bottom:12px">${title}<p class="note">Jev se corrió solo sobre la versión ${esc(J.version)} del prompt, con ${src} como fuente.</p>
      <button class="btn" id="jevver">Ver la versión ${esc(J.version)}</button></div>`;
  }
  const se = series.find((x) => x.id === J.source), s = se ? st.get(se) : null;
  const jcalls = D.calls.filter((c) => jIds(c.stem).length);
  const pairs = jcalls.flatMap((c) => jIds(c.stem).map((id) => ({ c, id, tag: tagOf(c.stem, id) })));
  const N = pairs.length, labeled = pairs.filter((x) => x.tag), yn = labeled.filter((x) => x.tag !== "nose"), nose = labeled.length - yn.length;
  const blindTagged = labeled.filter((x) => reviews[x.c.stem]?.motives?.[x.id]?.blind).length;
  // Referencia por llamada (aprox.): la etiqueta del par si existe; si no, la revisión manual de la llamada (lo
  // esperado es revertir, salvo que la hayas rechazado). Mismo cálculo que jev_review.py report.
  const truthRef = (x) => x.tag === "si" || (x.tag !== "no" && reviews[x.c.stem]?.verdict === "RECHAZADA");
  const tagsOf = (c) => jIds(c.stem).map((id) => tagOf(c.stem, id));
  const median = (xs) => { if (!xs.length) return null; const a = [...xs].sort((p, q) => p - q), m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const stat = (v) => {
    const conf = (x) => jConfirms(x.c.stem, x.id, v.key), ans = pairs.filter((x) => conf(x) != null), k = yn.filter((x) => conf(x) != null);
    const hit = (x) => conf(x) === (x.tag === "si"), confOf = (x) => jCell(x.c.stem, x.id, v.key)?.conf;
    const isChoice = v.type === "choice", hi = isChoice ? k.filter((x) => confOf(x) >= J.low_conf) : [], lo = isChoice ? k.filter((x) => confOf(x) < J.low_conf) : [];
    const rescued = jcalls.filter((c) => jevRescued(c, v.key, true));
    return { v, n: ans.length, r: ans.filter((x) => !conf(x)).length, k: k.length, x: k.filter(hit).length,
      e: k.filter((x) => x.tag === "si" && !conf(x)).length, f: k.filter((x) => x.tag === "no" && conf(x)).length,
      c: rescued.length, ok: rescued.filter((c) => tagsOf(c).every((t) => t === "no")).length, bad: rescued.filter((c) => tagsOf(c).includes("si")).length,
      y: ans.filter((x) => conf(x) === truthRef(x)).length, miss: N - ans.length, missK: yn.length - k.length,
      med: isChoice ? median(ans.map(confOf)) : null, x1: hi.filter(hit).length, k1: hi.length, x2: lo.filter(hit).length, k2: lo.length,
      cost: v.cost_usd, lat: v.latency_ms };
  };
  const rows = J.variants.map(stat), main = rows.find((r) => r.v.key === J.main);
  const blindRows = rows.filter((r) => r.v.mode === "blind"), findRows = rows.filter((r) => r.v.mode !== "blind");
  const base = { k: yn.length, x: yn.filter((x) => x.tag === "si").length, f: yn.filter((x) => x.tag === "no").length, y: pairs.filter(truthRef).length };
  const rate = (r) => r.k ? r.x / r.k : -1, bestRate = yn.length ? Math.max(...blindRows.map(rate)) : null;
  const bests = bestRate == null || bestRate < 0 ? [] : blindRows.filter((r) => rate(r) === bestRate);
  const fa = s ? s.A.R : null, nA = s ? s.A.n : 0;
  const realErr = (e) => `${e} incumplimiento${e === 1 ? "" : "s"} real${e === 1 ? "" : "es"}`;

  let lead;
  if (!labeled.length) {
    lead = `Todavía no se puede saber si Jev acierta: no hay motivos etiquetados. Por ahora, la variante principal (${esc(jevName(J.main))}) revierte <b>${main.r} de ${N}</b> motivos y rescataría <b>${main.c} de ${jcalls.length}</b> llamadas.`;
  } else if (labeled.length < N) {
    lead = `Resultado preliminar con <b>${labeled.length} de ${N}</b> motivos etiquetados: la variante principal acierta <b>${main.x} de ${main.k}</b>; ${src} sola, ${base.x} de ${base.k}.`
      + (main.e ? ` <span class="err">Ojo: revierte ${realErr(main.e)}.</span>` : "");
  } else if (!yn.length) {
    lead = `Los ${N} motivos están marcados «No sé»: no se puede calcular el acierto de Jev.`;
  } else {
    const b = bests[0] || main;
    lead = (bests.length > 1
      ? `Con los ${N} motivos revisados, las variantes ciegas ${bests.map((r) => `<b>${esc(jevName(r.v.key, false))}</b>`).join(" y ")} empatan con <b>${b.x} de ${b.k}</b>; ${src} sola, ${base.x} de ${base.k}.`
      : `Con los ${N} motivos revisados, la mejor variante ciega, <b>${esc(jevName(b.v.key, false))}</b>, acierta <b>${b.x} de ${b.k}</b>; ${src} sola, ${base.x} de ${base.k}.`)
      + ` Esa variante revierte ${realErr(b.e)} y bajaría las falsas alarmas de ${src} de ${fa ?? "—"} a ${fa == null ? "—" : fa - b.c}.`
      + (b.v.type === "choice" && b.k2 ? ` Con confianza bajo ${pctJ(J.low_conf)}, acierta ${b.x2} de ${b.k2}.` : "");
  }

  const dash = "—", none = !yn.length;
  const cols = ["Variante", "Revierte", "Acierta según tus etiquetas", "Revierte un incumplimiento real", "Confirma una falsa alarma", "Llamadas rescatadas",
    "Referencia por llamada (aprox.)", "Confianza mediana", `Acierta con confianza ≥ ${pctJ(J.low_conf)} · < ${pctJ(J.low_conf)}`, "Costo estimado", "Latencia prom."];
  const tr = (r, cls = "") => {
    const isMain = r.v.key === J.main, best = bests.includes(r), choice = r.v.type === "choice";
    const xCell = none || !r.k ? dash : `${best ? "<b>" : ""}${r.x} de ${r.k}${best ? ` (${bests.length > 1 ? "empate" : "mejor"})</b>` : ""}`;
    const noConf = ` title="La pregunta sí/no no entrega confianza"`;
    return `<tr class="${cls}"><th scope="row">${esc(jevName(r.v.key, false))}${isMain ? " ★" : ""}</th>
      <td class="n"${r.miss ? ` title="Jev no respondió en ${r.miss} motivos"` : ""}>${r.r} de ${r.n}</td>
      <td class="n"${r.missK ? ` title="Jev no respondió en ${r.missK} motivos etiquetados"` : ""}>${xCell}</td>
      <td class="n">${none ? dash : r.e ? `<span class="err">${r.e}</span>` : 0}</td>
      <td class="n">${none ? dash : r.f}</td>
      <td class="n">${r.c} de ${jcalls.length}<div class="rv">${none ? "sin etiquetas" : `${r.ok} bien · ${r.bad} con incumplimiento real · ${r.c - r.ok - r.bad} sin etiqueta concluyente`}</div></td>
      <td class="n" style="color:var(--text-2)" title="Aproximada: la revisión por llamada no dice qué motivo falló.">${r.y} de ${r.n}</td>
      <td class="n"${choice ? "" : noConf}>${choice && r.med != null ? pctJ(r.med) : dash}</td>
      <td class="n"${choice ? "" : noConf}>${choice && !none ? `${r.x1} de ${r.k1} · ${r.x2} de ${r.k2}` : dash}</td>
      <td class="n" title="Calculado con el precio de entrada registrado en jev_review.py; confírmalo en la consola de TypeSafe antes de presupuestar.">${fmtUsd(r.cost, 4)}</td>
      <td class="n">${(r.lat / 1000).toLocaleString("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} s</td></tr>`;
  };
  const head = `<thead><tr>${cols.map((c, i) => `<th scope="col"${i ? ' class="n"' : ""} style="white-space:normal">${c}</th>`).join("")}</tr></thead>`;
  const grp = (label, rs, cls = "") => rs.length ? `<tbody><tr><th colspan="${cols.length}" scope="rowgroup">${label}</th></tr>${rs.map((r) => tr(r, cls)).join("")}</tbody>` : "";
  const table = (caption, body) => `<div class="wrap" tabindex="0" role="region" aria-label="${caption}"><table class="jvt"><caption class="sr">${caption}</caption>${head}${body}</table></div>`;
  const caption = `Resultado de cada variante de Jev sobre los ${N} motivos`;
  const pend = N - labeled.length;
  const baseRow = `<tbody><tr><th colspan="${cols.length}" scope="rowgroup">Línea base</th></tr>
    <tr><th scope="row">${src} sola (confirma todo)</th><td class="n">0 de ${N}</td><td class="n">${none ? dash : `${base.x} de ${base.k}`}</td><td class="n">${none ? dash : 0}</td><td class="n">${none ? dash : base.f}</td><td class="n">0 de ${jcalls.length}</td><td class="n" style="color:var(--text-2)">${base.y} de ${N}</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr></tbody>`;

  return `<div class="card" style="margin-bottom:12px">${title}
    <p class="note">Experimento sobre la versión ${esc(J.version)}: ${N} motivos que ${src} marcó como incumplidos en ${jcalls.length} llamadas que el Excel aprobó. Con la pregunta de opciones, Jev elige incumple, cumple o no aplica y entrega su confianza; «cumple» y «no aplica» revierten el rechazo. Con la pregunta sí/no, entrega solo la probabilidad de incumplimiento: desde 0,5 confirma. No depende de los selectores de métrica ni de consenso; las llamadas «por revisar» se cuentan igual que en la matriz de arriba.</p>
    <p class="lead" style="font-size:14px;margin:0 0 12px;max-width:1000px">${lead}</p>
    <div class="tiles" style="margin-bottom:12px">
      <div class="tile"><div class="v">${fa == null ? dash : `${fa} → ${fa - main.c}`}</div><div class="l">Falsas alarmas de ${src}, de ${nA} aprobadas por el Excel</div><div class="s">si se aplicara ${esc(jevName(J.main))}</div></div>
      <div class="tile"><div class="v">${labeled.length} de ${N}</div><div class="l">Motivos etiquetados</div><div class="s">${labeled.length ? `${blindTagged} sin ver a Jev` : "etiquétalos en Revisión"}</div></div>
      <div class="tile"><div class="v${main.e ? " err" : ""}">${none ? dash : main.e}</div><div class="l">Incumplimientos reales que Jev revierte</div><div class="s">Es el error caro: cada uno es un incumplimiento que dejaría de verse.</div></div>
    </div>
    ${table(caption, grp("Ciego · pregunta de opciones", blindRows.filter((r) => r.v.type === "choice")) + grp("Ciego · pregunta sí/no", blindRows.filter((r) => r.v.type !== "choice")) + baseRow)}
    ${findRows.length ? `<details style="margin-top:6px"><summary>Ver las ${findRows.length} variantes con hallazgo (ancladas a Gemini)</summary>
      <p class="note">Ven el comentario y la evidencia de Gemini y casi siempre le dan la razón: úsalas solo como referencia. No compiten por «mejor».</p>
      ${table("Variantes de Jev con el hallazgo de Gemini", grp("Con hallazgo · pregunta de opciones", findRows.filter((r) => r.v.type === "choice"), "dim") + grp("Con hallazgo · pregunta sí/no", findRows.filter((r) => r.v.type !== "choice"), "dim"))}</details>` : ""}
    <p class="note" style="margin-top:8px">★ variante principal (${esc(jevName(J.main))}).${nose ? ` ${nose} motivo${nose > 1 ? "s" : ""} marcado${nose > 1 ? "s" : ""} «No sé» no cuenta${nose > 1 ? "n" : ""} para el acierto.` : ""}
      Con ${N} motivos, cada uno vale ${(100 / N).toLocaleString("es-CL", { maximumFractionDigits: 1 })} puntos: diferencias de 1 o 2 motivos entre variantes no son concluyentes. Por eso se muestran conteos y no porcentajes.</p>
    ${pend ? `<button class="btn${labeled.length ? "" : " on"}" id="jevpend">Etiquetar motivos pendientes (${pend}) →</button>` : ""}
  </div>`;
}

function selectModel(m) {
  activeModel = m;
  document.querySelectorAll(".mt").forEach((x) => x.classList.toggle("on", x.dataset.m === m));
  renderModel();
}

// ---------- Tabs / versión ----------
function show(tab) {
  $("#dash").hidden = tab !== "dash"; $("#rev").hidden = tab !== "rev";
  $("#t-dash").classList.toggle("on", tab === "dash"); $("#t-rev").classList.toggle("on", tab === "rev");
  try { localStorage.setItem("l2-tab", tab); } catch {}
}
$("#t-dash").onclick = () => { renderDash(); show("dash"); };
$("#t-rev").onclick = () => show("rev");
function setVersion(v) { version = v; $("#ver").value = v; renderDash(); renderList(); if (current) openCall(current.stem); }
$("#ver").onchange = (e) => setVersion(e.target.value);
renderDash();
renderRevShell();
loadServerReviews().then(() => { renderDash(); renderList(); if (current) openCall(current.stem); });
let startTab = "dash";
try { startTab = localStorage.getItem("l2-tab") || "dash"; } catch {}
show(startTab);
</script>
</body>
