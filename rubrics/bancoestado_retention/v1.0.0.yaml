# Pauta de retención BancoEstado Corredores de Seguros: 33 motivos en 5 bloques.
# Versión publicada = inmutable; para cambiar algo, crear v1.0.1 (o la que corresponda) al lado.
# Descripciones: texto oficial de la pauta (docs/context.md). Gravedad y tipo: TBD con el cliente
# (docs/client-open-questions.md, n.º 1); mientras tanto el motor usa `decision.minor_proposal`.
id: bancoestado_retention
version: "1.0.0"

decision:
  # Todo motivo incumplido rechaza la llamada. Si todos los incumplidos están en minor_proposal, el rechazo es
  # leve y queda marcado para revisión. Propuesta empírica de las 100 llamadas reales (real_calls.MINOR_CRITERIA),
  # no confirmada por el cliente.
  minor_proposal: [2, 3, 16, 18, 25, 28, 30, 32]
  # Motivo 1 en código: espera más larga del ejecutivo (holds_sec) contra este umbral. La nota del cliente dice
  # "más de 30 s"; el auditor aprobó hasta 35 s en las llamadas reales. TBD (client-open-questions n.º 3).
  hold_limit_sec: 35

blocks:
  - {id: A, name: Acreditación y protocolo de cierre, criteria: [31, 33, 29, 30, 13, 15, 27]}
  - {id: B, name: Conocimiento del producto, criteria: [4, 2, 6, 5, 28]}
  - {id: C, name: Gestión de la retención, criteria: [14, 17, 9, 16, 3, 12, 32, 7, 26]}
  - {id: D, name: Trato, criteria: [1, 8, 11, 10]}
  - {id: E, name: Tipificación, criteria: [18, 19, 24, 20, 21, 22, 23, 25]}

criteria:
  - {id: M1, block: D, description: "Deja en espera por tiempo excesivo", type: TBD, severity: TBD, layers: [layer1], decision_rule: hold_over_limit}
  - {id: M2, block: B, description: "Descripción del seguro corresponde a otro seguro", type: TBD, severity: TBD, layers: [layer2], decision_rule: non_compliant_rejects, product_sheet_section: coverages}
  - {id: M3, block: C, description: "Excede 3 objeciones máximo para retención", type: TBD, severity: TBD, layers: [layer2], decision_rule: non_compliant_rejects}
  - {id: M4, block: B, description: "No indica ninguna característica del seguro a renunciar", type: TBD, severity: TBD, layers: [layer2], decision_rule: non_compliant_rejects, product_sheet_section: coverages}
  - {id: M5, block: B, description: "No informa que la permanencia la maneja cliente ante consulta directa", type: TBD, severity: TBD, layers: [layer2], decision_rule: non_compliant_rejects}
  - {id: M6, block: B, description: "No maneja información del producto o coberturas", type: TBD, severity: TBD, layers: [layer2], decision_rule: non_compliant_rejects, product_sheet_section: coverages}
