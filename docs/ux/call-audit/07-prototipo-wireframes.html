const vtag=v=>`<span class="tag ${VL[v][0]}">${VL[v][1]}</span>`;
function fnd(n){return CALL.findings[n]||{v:"compliant",conf:.9,t:null,q:null,c:"Sin incumplimiento detectado."};}
function finalV(n){const w=S.work[n];return w&&w.v?w.v:fnd(n).v;}
function pendingCount(){return Object.keys(CALL.findings).filter(n=>fnd(n).v==="uncertain"&&!(S.work[n]&&S.work[n].done)).length;}
function resultV(){const all=Object.keys(MOTIVOS).map(Number);if(all.some(n=>finalV(n)==="non_compliant"))return"non_compliant";if(pendingCount())return"uncertain";return"compliant";}
function actionable(){return BLOCKS.flatMap(b=>b[2]).filter(n=>["non_compliant","uncertain"].includes(fnd(n).v));}

/* ---------- Render ---------- */
function render(){
  NOTES=[];
  document.body.classList.toggle("no-ann",!S.ann);
  $("#pAnn").textContent=S.ann?"Ocultar anotaciones":"Mostrar anotaciones";
  let html="";
  if(S.screen==="login") html=vLogin();
  else{
    const role=SCREENS[S.screen][1];S.role=role;
    html=`<div class="app ${S.collapsed||S.screen.endsWith("call")?"collapsed":""}">${vSide(role)}<main class="main" id="main">${vMain()}</main></div>`;
  }
  const notes=NOTES.length?`<aside class="notes" aria-label="Anotaciones del wireframe"><h3>Anotaciones · ${esc(SCREENS[S.screen][0])}</h3><ol>${NOTES.map(n=>`<li>${n[0]} ${n[1]?`<code>${n[1]}</code>`:""}</li>`).join("")}</ol></aside>`:"";
  $("#root").innerHTML=html+notes;
  $("#layer").innerHTML=vLayer();
  $("#pScreen").value=S.screen;$("#pState").value=S.state;
  const f=document.querySelector("[data-autofocus]");if(f)f.focus();
}
function vSide(role){
  const items=NAV[role].map(([l,k,c])=>{const on=S.screen===k||(k==="a/queue"&&["a/call","a/end"].includes(S.screen))||(k==="s/agents"&&S.screen==="s/agent")||(k==="s/auditors"&&S.screen==="s/accounts");const n=c?c():0;
    return `<button class="nav-i ${on?"on":""}" data-go="${k}" ${on?'aria-current="page"':""}><span class="ico" aria-hidden="true"></span><span class="lbl">${l}</span>${n?`<span class="badge" aria-label="${n} pendientes">${n}</span>`:""}</button>`;}).join("");
  return `<nav class="side" aria-label="Navegación principal">
   <div class="brand"><span class="logo" aria-hidden="true">Q</span><span class="brand-t"><b>Qubico</b><small>Auditoría de llamadas</small></span></div>
   ${A("Sidebar fija; contadores = trabajo que espera acción. En el detalle se colapsa sola a íconos.","05 §1.1 · O-13")}
   ${items}
   <div class="user"><button class="nav-i" data-act="toggleSide"><span class="ico"></span><span class="lbl">${S.collapsed?"Expandir":"Colapsar"} menú</span></button>
   <button class="nav-i" data-dlg="shortcuts"><span class="ico"></span><span class="lbl">Atajos de teclado</span></button>
   <button class="nav-i" data-go="login"><span class="ico"></span><span class="user-t">${role==="auditor"?"Auditora Ana P. · Auditor":"Supervisor Jorge L. · Supervisor"}<br><small class="help">Cerrar sesión</small></span></button></div>
  </nav>`;
}
function stateBlock(kind){
  if(S.state==="loading")return `<div class="card" aria-busy="true"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div><span class="sr">Cargando…</span></div>${A("Esqueleto con la forma final; sin spinner bloqueante.","05 §2 Carga")}`;
  if(S.state==="error")return `<div class="err" role="alert"><b>No pudimos cargar ${kind}.</b><p>Revisa tu conexión e intenta de nuevo.</p><button class="btn pri" data-state="normal">Reintentar</button></div>${A("Error: qué pasó + qué hacer; sin códigos técnicos.","06 §2.3")}`;
  return null;
}
function vMain(){
  switch(S.screen){
    case "a/queue":return vQueue(false);case "s/queue":return vQueue(true);
    case "a/call":return vCall(false);case "s/call":return vCall(true);
    case "a/end":return vEnd();case "a/my":return vMy();
    case "s/home":return vHome();case "s/alerts":return vAlerts();case "s/reviews":return vReviews();
    case "s/agents":return vAgents();case "s/agent":return vAgent();case "s/criteria":return vCriteria();
    case "s/auditors":return vAuditors();case "s/accounts":return vAccounts();}
  return "";
}
function vLogin(){
  NOTES=[];
  return `<div class="login"><div class="card">
  <div class="brand"><span class="logo">Q</span><span><b>Qubico</b><small>Auditoría de llamadas</small></span></div>
  <h1 style="margin:0;font-size:22px">Auditoría de llamadas</h1><p class="help" style="margin:0">La IA propone hallazgos; las personas deciden.</p>
  <button class="btn pri" data-go="a/queue">Ingresar con la cuenta de tu empresa</button>${A("SSO genérico: el proveedor aún no se conoce (#25).","D-17")}
  <div class="help">o ingresa con tu correo</div>
  <div class="field"><label for="em">Correo</label><input id="em" type="email" autocomplete="username"></div>
  <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
  ${A("Se permite pegar y usar el gestor de contraseñas; sin CAPTCHA cognitivo.","WCAG 3.3.8")}
  ${S.state==="error"?`<div class="err" role="alert">El correo o la contraseña no son correctos.</div>${A("Mismo mensaje para correo inexistente o clave errónea.","L-11")}`:""}
  <div style="display:flex;gap:8px"><button class="btn" data-go="a/queue">Ingresar como auditora</button><button class="btn" data-go="s/home">Ingresar como supervisor</button></div>
  ${A("Dos botones solo para el prototipo: el rol real viene de la cuenta (sin selector de rol).","D-05 · L-11")}
  <a href="#" data-act="noop">¿Olvidaste tu contraseña?</a>
  <div class="help">Sin auto-registro: las cuentas las crea tu supervisor o Qubico. ${A("Sin enlace 'Crear cuenta'.","D-12 · L-17")}</div>
  <div class="help" style="border-top:1px solid var(--line);padding-top:8px"><a href="#" data-act="noop">Privacidad</a> · <a href="#" data-act="noop">Términos de uso</a> · <a href="#" data-act="noop">Cookies</a> ${A("Textos legales en el pie (resúmenes en 06 §4).","L-27")}</div>
  </div></div>`;
}
function vQueue(ro){
  const st=stateBlock("la cola");
  const rows=QUEUE.filter(r=>!S.ejFilter||r[2]===S.ejFilter);
  let body;
  if(st)body=st;
  else if(S.state==="empty"||!rows.length){body=S.ejFilter?`<div class="empty"><h2>Terminaste los casos pendientes de ${esc(S.ejFilter)}.</h2><div style="display:flex;gap:8px"><button class="btn pri" data-act="clearEj">Ver toda la cola</button><button class="btn">Mantener filtro</button></div></div>${A("Aviso al agotar el filtro de ejecutivo: evita que el filtro 'se pegue'.","F-03")}`
    :`<div class="empty"><h2>No hay casos con estos filtros.</h2><button class="btn" data-act="clearEj">Limpiar filtros</button></div>`;}
  else body=`<table><thead><tr><th aria-sort="none">Fecha</th><th>Llamada</th><th>Ejecutivo</th><th>Seguros</th><th aria-sort="descending">Decisión del motor ↓</th><th>No cumple</th><th>Dudosos</th><th>Duración</th><th>En cola</th>${ro?"<th>Auditor</th>":""}</tr></thead><tbody>
   ${rows.map(r=>`<tr data-go="${ro?"s/call":"a/call"}" tabindex="0"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]==="s"?'<span class="tag s">Muestra cumple</span>':vtag(r[4]==="nc"?"non_compliant":"uncertain")}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}${r[9]?' · <span class="tag s">🔒 En revisión por Luis M.</span>':""}</td>${ro?"<td>"+(r[9]?"Luis M.":"—")+"</td>":""}</tr>`).join("")}
   </tbody></table>${A("Orden por defecto: gravedad y luego antigüedad; columnas ordenables con aria-sort.","HU-AUD-01")}${A("Candado + texto para casos bloqueados (no solo color).","O-10 · P-13")}${A("Sin PII del cliente en la lista; el nombre del ejecutivo sí (decisión del usuario).","D-07 · L-03")}`;
  return `<div class="ph"><div><h1>${ro?"Cola completa":"Cola de casos"}</h1><p>Ordenada por gravedad y luego por antigüedad.${ro?" Solo lectura.":""}</p></div>
   <div class="acts">${ro?A("Supervisor: solo lectura en el MVP; reasignar es Post.","H-33"):`<span class="help" style="align-self:center">${QUEUE.length} pendientes · 12 revisados hoy</span><button class="btn pri" data-go="a/call">Tomar siguiente</button>${A("'Tomar siguiente' respeta el filtro activo.","O-11 · HU-AUD-01")}`}</div></div>
   <div class="filters" role="search">
    <label class="sr" for="ejq">Buscar ejecutivo</label><input id="ejq" list="ejl" placeholder="Buscar ejecutivo" value="${esc(S.ejFilter||"")}" data-act="ejInput">
    <datalist id="ejl">${[...new Set(EJS)].map(e=>`<option value="${e}">`).join("")}</datalist>
    <select aria-label="Decisión"><option>Decisión: todas</option><option>No cumple</option><option>Dudosa</option><option>Muestra cumple</option></select>
    <select aria-label="Bloque"><option>Bloque: todos</option>${BLOCKS.map(b=>`<option>${b[1]}</option>`)}</select>
    <select aria-label="Seguro"><option>Seguro: todos</option></select><select aria-label="Fechas"><option>Hoy</option><option>Últimos 7 días</option></select>
    ${S.ejFilter?`<span class="chip">Ejecutivo: ${esc(S.ejFilter)} <button aria-label="Quitar filtro de ejecutivo" data-act="clearEj">✕</button></span>`:""}
    <span class="help">Las búsquedas por ejecutivo quedan registradas.</span>${A("Combobox con autocompletado; chip visible del filtro; aviso de registro.","D-07 · D-13 · L-18")}
   </div>${body}`;
}
function vCall(sup){
  const st=stateBlock("el caso");if(st)return st;
  const ac=actionable();
  const head=`<div class="d-head"><button class="btn ghost" data-go="${sup?"s/reviews":"a/queue"}">← Volver a ${sup?"Revisiones":"Cola"}</button>
   <h1>Llamada ${CALL.id}</h1><span class="help">${CALL.fecha} · ${esc(CALL.ej)} · ${CALL.seguros.join(", ")}</span>
   <span>Decisión del motor: ${vtag("non_compliant")}</span><span class="help">Regla aplicada: ${CALL.rule}</span>
   <span class="tag s">${sup?"Por aprobar · Auditora Ana P.":"En revisión por ti"}</span></div>
   <div class="banner" role="note">Hallazgos generados por IA, pendientes de revisión humana. No constituyen una sanción.</div>${A("Banner fijo, no se puede cerrar.","L-07 · L-15")}`;
  const audioErr=S.state==="empty";
  const pct=S.cur/CALL.dur*100;
  const bars=Array.from({length:120},(_,i)=>{const h=8+Math.abs(Math.sin(i*1.7)*26+Math.cos(i*.6)*8);return `<rect x="${i*10}" y="${44-h}" width="6" height="${h}" fill="${i/120*100<pct?"#555":"#bbb"}"/>`}).join("");
  const markers=Object.entries(CALL.findings).filter(([n,f])=>f.t!=null&&f.v!=="compliant").map(([n,f])=>`<button class="mk ${VL[f.v][0]}" style="left:${f.t/CALL.dur*100}%" data-focus="${n}" aria-label="Motivo ${n}, ${VL[f.v][1]}, minuto ${mmss(f.t)}"><span></span></button>`).join("");
  const player=audioErr?`<div class="player"><div class="err" role="alert" style="flex:1">No pudimos cargar el audio. Puedes revisar con la transcripción o escalar el caso con el motivo «Audio inaudible».</div></div>${A("Estado 'audio no disponible' (selector Estado = Vacío). La transcripción sigue usable.","F-01")}`
   :`<div class="player" aria-label="Reproductor"><button class="btn" data-act="play" aria-label="${S.playing?"Pausar":"Reproducir"}">${S.playing?"❚❚":"▶"}</button><button class="btn ghost" data-act="back5" aria-label="Retroceder 5 s">−5 s</button><button class="btn ghost" data-act="fwd5" aria-label="Avanzar 5 s">+5 s</button>
    <span style="font-variant-numeric:tabular-nums">${mmss(S.cur)} / ${mmss(CALL.dur)}</span>
    <div class="wave" data-act="seek"><svg viewBox="0 0 1200 44" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>${markers}</div>
    <select aria-label="Velocidad"><option>1x</option><option>1,25x</option><option selected>1,5x</option><option>2x</option></select></div>
    ${A("Marcas por hallazgo con forma distinta por veredicto (cuadrado lleno = no cumple; círculo punteado = dudosa). Área de clic 24 px.","WCAG 1.4.1 · 2.5.8 · O-01")}${A("Al abrir, el audio queda en pausa 3–5 s antes de la primera evidencia relevante.","O-01 · H-31")}`;
  const curTurn=CALL.transcript.reduce((a,t,i)=>t[0]<=S.cur?i:a,0);
  const ff=fnd(S.focus);
  const tx=`<section class="col" aria-label="Transcripción"><div class="col-h"><b>Transcripción</b><span class="help">Datos personales enmascarados</span><input placeholder="Buscar en la transcripción" style="margin-left:auto;border:1px solid var(--line);border-radius:6px;padding:3px 6px;width:150px" aria-label="Buscar en la transcripción"></div>
    ${A("Turnos por hablante (Ejecutivo/Cliente/Otro); clic salta el audio; lista virtualizada en la implementación (hasta 314 turnos).","H-12 · H-13 · O-01")}
    ${CALL.transcript.map((t,i)=>{let txt=esc(t[2]);if(ff.q&&t[0]===ff.t){txt=txt.replace(esc(ff.q).slice(0,30),m=>`<mark>${m}</mark>`);}
      return `<div class="turn ${i===curTurn?"on":""}" data-seek="${t[0]}" role="button" tabindex="0"><span class="t">${mmss(t[0])}</span><span class="sp">${t[1]}</span><span>${txt}${S.work["tx"+i]?' <span class="tag s">Mal transcrito</span>':""}</span></div>`}).join("")}
    ${A("PII enmascarada también dentro del texto: [nombre del cliente], RUT ••••••-K.","O-16 · L-03")}
    <div style="padding:8px 10px"><button class="btn ghost" data-act="marktx">Marcar el turno actual como mal transcrito</button></div></section>`;
  const blocks=BLOCKS.map(([k,name,ns])=>{const nc=ns.filter(n=>finalV(n)==="non_compliant").length,du=ns.filter(n=>finalV(n)==="uncertain").length;
    const open=S.openBlocks[k]!==undefined?S.openBlocks[k]:(nc+du>0);
    return `<div class="blk"><button aria-expanded="${open}" data-blk="${k}">${open?"▾":"▸"} ${name} <small>· ${nc} no cumple · ${du} dudosos</small></button>${open?ns.map(n=>vItem(n,sup)).join(""):""}</div>`}).join("");
  const ck=`<section class="col" aria-label="Pauta de calidad"><div class="col-h"><b>Pauta de calidad</b><span class="help">${ac.length} hallazgos piden acción · 33 motivos</span></div>
   ${A("Solo se abren los bloques con hallazgos que piden acción; los 'cumple' quedan como aceptados sin cambios al guardar.","O-02 · D-18")}
   ${sup?A("Modo supervisor: por ítem se ve IA → Auditor y el motivo de la corrección (vista de diferencias).","O-09 · HU-SUP-06"):""}
   ${blocks}
   ${sup?"":`<div style="padding:10px"><button class="btn" data-act="addOpen">+ Agregar hallazgo que la IA no detectó</button>${S.addOpen?`<div class="inline-f"><label>Motivo<select data-autofocus>${Object.keys(MOTIVOS).map(n=>`<option>Motivo ${n} · ${MOTIVOS[n]}</option>`).join("")}</select></label><label>Minuto <input value="${mmss(S.cur)}"></label><span class="help">Se registra en el minuto actual del audio (${mmss(S.cur)}). Puedes cambiarlo.</span><label>Comentario<textarea rows="2"></textarea></label><div class="row" style="display:flex;gap:8px"><button class="btn pri" data-act="addSave">Agregar hallazgo</button><button class="btn" data-act="addOpen">Cancelar</button></div></div>${A("Falso negativo: toma el minuto actual (no se pide de nuevo).","HU-AUD-03 · WCAG 3.3.7")}`:""}</div>`}</section>`;
  const rel=FICHA_REL[S.focus];
  const sec=(key,title,rows,collapsible)=>`<div class="fi-sec ${rel===key?"hl":""}"><b>${title}</b>${rel===key?` <span class="tag">Relevante para el motivo ${S.focus}</span>`:""}<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></div>`;
  const fi=S.fichaOpen?`<section class="col" aria-label="Ficha del seguro"><div class="col-h"><b>Ficha del seguro</b><button class="btn ghost" style="margin-left:auto" data-act="ficha" aria-label="Plegar ficha">⇥</button></div>
   <div class="tabs" role="tablist" style="margin:0"><button role="tab" aria-selected="true">Seguro 1: ${FICHA.nombre}</button></div>
   ${sec("llamada","Datos de la llamada",FICHA.llamada)}${sec("categoria","Categoría",FICHA.categoria)}${sec("prima","Prima",FICHA.prima)}${sec("devolucion","Devolución",FICHA.devolucion)}${sec("retracto","Retracto",FICHA.retracto)}
   <div class="fi-sec ${rel==="coberturas"?"hl":""}"><details ${rel==="coberturas"?"open":""}><summary><b>Coberturas</b></summary><dl>${FICHA.coberturas.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl></details></div>
   <div class="fi-sec"><details><summary><b>Asistencias y beneficios · Primas · Siniestros · Observaciones</b></summary><p class="help">Secciones plegables con el detalle del catálogo.</p></details></div>
   ${A("Ficha contextual: se destaca la sección relevante para el motivo en foco (ej. 28 → Devolución). El mapeo motivo → sección es configuración.","D-02 · O-03 · H-32")}${A("N° de seguro y póliza enmascarados; medio de pago traducido a texto.","L-20")}</section>`
   :`<button class="col btn" style="min-height:420px;writing-mode:vertical-rl" data-act="ficha">Ficha del seguro</button>`;
  const pend=pendingCount(),rv=resultV();
  const bar=sup?`<div class="actbar"><span class="grow">Revisión de Auditora Ana P. · 4 min 12 s · Veredicto del auditor: ${vtag("non_compliant")}</span><button class="btn" data-dlg="reopen">Reabrir</button><button class="btn" data-dlg="override">Cambiar decisión</button><button class="btn pri" data-act="supApprove">Aprobar y cerrar</button></div>${A("Barra de acciones del supervisor; la decisión original del auditor siempre se conserva.","HU-SUP-07 · L-23")}`
   :`<div class="actbar"><span class="grow" aria-live="polite">Veredicto resultante: ${vtag(rv)} · ${pend?`Te queda${pend>1?"n":""} ${pend} hallazgo${pend>1?"s":""} dudoso${pend>1?"s":""} por resolver.`:"Todo listo para guardar."}</span>
     <button class="btn" data-dlg="escalate">Escalar<span class="kbd">E</span></button><button class="btn pri" data-act="save" ${pend?"disabled aria-disabled=\"true\"":""}>Guardar y siguiente<span class="kbd">↵</span></button></div>
     ${A("Guardar deshabilitado mientras haya dudosos; el texto explica por qué. Veredicto en vivo anunciado por aria-live.","HU-AUD-03 · WCAG 4.1.3")}${A("Atajos: Espacio, ←/→, J/K, C, X, E, Enter, ?. Desactivables en Preferencias.","HU-AUD-04 · WCAG 2.1.4")}`;
  return head+player+`<div class="cols ${S.fichaOpen?"":"nofi"}">${tx}${ck}${fi}</div>`+bar;
}
function vItem(n,sup){
  const f=fnd(n),w=S.work[n]||{},foc=S.focus==n,v=finalV(n);
  const needs=["non_compliant","uncertain"].includes(f.v);
  let h=`<div class="item ${foc?"focus":""}" id="it${n}"><div class="top"><span class="nm"><b>Motivo ${n}</b> · ${MOTIVOS[n]} ${f.crit?'<span class="tag">Crítico</span>':""}</span>${vtag(v)}</div>`;
  if(!needs&&!foc){return h+(sup?"":`<div class="meta">La IA propone: Cumple · <span class="help" title="Si no lo cambias, queda como aceptado sin cambios al guardar.">aceptado sin cambios al guardar</span> <button class="btn ghost" data-focus="${n}">Revisar</button></div>`)+"</div>";}
  h+=`<div class="meta">La IA propone: ${VL[f.v][1]} · Confianza ${Math.round(f.conf*100)} %</div>`;
  const evid=f.q?`<button class="btn ghost" data-focus="${n}">Ir a la evidencia · ${mmss(f.t)}</button><div class="quote">“${esc(f.q)}”</div>${f.unval?`<div class="err" style="padding:6px;border-width:1px">⚠ Esta cita no aparece tal cual en la transcripción. Verifícala en el audio.</div>`:""}`:"";
  const com=f.v==="uncertain"?`<details><summary>Ver comentario de la IA</summary><p>${esc(f.c)}</p></details>`:`<p style="margin:4px 0">IA: ${esc(f.c)}</p>`;
  h+=f.v==="uncertain"?evid+com:com+evid;
  if(f.v==="uncertain"&&foc)h+=A("Dudosa: primero la evidencia, el comentario de la IA plegado (evita anclar).","O-06 · H-16");
  if(f.unval&&foc)h+=A("Cita no validada contra la transcripción → aviso explícito.","Regla 4");
  if(sup){h+=`<div class="diffc">IA: ${VL[f.v][1]} → Auditor: ${n==3?"Cumple · Motivo: Criterio ambiguo en la pauta":VL[f.v][1]+" (confirmó)"}</div>`;return h+"</div>";}
  const opts=(f.v!=="uncertain"?[["confirm","Confirmar"]]:[]).concat([["compliant","Cumple"],["non_compliant","No cumple"],["not_applicable","No aplica"]].filter(o=>o[0]!==f.v));
  h+=`<div class="seg" role="group" aria-label="Decisión sobre el motivo ${n}">${opts.map(([k,l])=>`<button aria-pressed="${w.choice===k}" data-choose="${n}:${k}">${l}${k==="confirm"?'<span class="kbd">C</span>':""}</button>`).join("")}</div>`;
  if(S.corrOpen==n){h+=`<div class="inline-f"><label>Motivo de la corrección<select data-autofocus id="cr${n}"><option value="">Elige un motivo…</option><option>Evidencia mal interpretada</option><option>Error de transcripción</option><option>Criterio ambiguo en la pauta</option><option>Evidencia fuera del fragmento</option><option>No aplica al seguro o a la gestión</option><option>La IA no detectó el incumplimiento</option><option>Otro</option></select></label><label>Comentario (obligatorio si eliges «Otro»)<textarea rows="2"></textarea></label><div style="display:flex;gap:8px"><button class="btn pri" data-corrok="${n}">Guardar corrección</button><button class="btn" data-act="corrCancel">Cancelar</button></div></div>${A("Corrección en un paso, en línea (sin modal); comentario obligatorio solo con 'Otro'.","O-04 · #21")}`;}

  return h;
}
/* ---------- Interacción ---------- */
function go(k){S.screen=k;S.dialog=null;S.drawer=null;if(k==="a/call"||k==="s/call"){S.work={};S.corrOpen=null;S.addOpen=false;S.openBlocks={};const ac=actionable();S.focus=ac[0];S.cur=Math.max(0,fnd(ac[0]).t-5);}location.hash=k;render();window.scrollTo(0,0);if(k.endsWith("call")){const el=document.getElementById("it"+S.focus);if(el)el.scrollIntoView({block:"center"});}}
function toast(t,undo){S.toast={t,undo};render();clearTimeout(toast.h);toast.h=setTimeout(()=>{S.toast=null;render();},undo?10000:3500);}
function focusItem(n){S.focus=+n;const f=fnd(n);if(f.t!=null)S.cur=Math.max(0,f.t-4);const b=BLOCKS.find(b=>b[2].includes(+n));S.openBlocks[b[0]]=true;render();const el=document.getElementById("it"+n);if(el)el.scrollIntoView({block:"nearest"});}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-dlg],[data-focus],[data-seek],[data-blk],[data-choose],[data-corrok],[data-state],[data-rtab],[data-sel],[data-gest],[data-deact],[data-react]");if(!t)return;
  const ds=t.dataset;
  if(ds.go!==undefined){e.preventDefault();go(ds.go);return;}
  if(ds.dlg){S.dialog=ds.dlg;render();return;}
  if(ds.state){S.state=ds.state;render();return;}
  if(ds.focus){focusItem(ds.focus);return;}
  if(ds.seek){S.cur=+ds.seek;render();return;}
  if(ds.blk){const k=ds.blk;const cur=S.openBlocks[k]!==undefined?S.openBlocks[k]:BLOCKS.find(b=>b[0]===k)[2].some(n=>["non_compliant","uncertain"].includes(finalV(n)));S.openBlocks[k]=!cur;render();return;}
  if(ds.choose){const [n,k]=ds.choose.split(":");S.focus=+n;if(k==="confirm"){S.work[n]={choice:"confirm",done:true};S.corrOpen=null;}else{S.work[n]={choice:k,v:k};S.corrOpen=+n;}render();return;}
  if(ds.corrok){const n=ds.corrok;const sel=document.getElementById("cr"+n);if(!sel.value){sel.setCustomValidity("Elige un motivo de corrección.");sel.reportValidity();return;}S.work[n].done=true;S.corrOpen=null;render();return;}
  if(ds.rtab){S.revTab=ds.rtab;render();return;}
  if(ds.sel){S.sel.has(ds.sel)?S.sel.delete(ds.sel):(S.sel.size<50&&S.sel.add(ds.sel));render();return;}
  if(ds.gest){S.alerts.find(a=>a.id==ds.gest).st="Gestionada";toast("Alerta marcada como gestionada.");return;}
  if(ds.deact){S.dialog="deact:"+ds.deact;render();return;}
  if(ds.react){S.accounts[+ds.react][2]="Activo";toast("Cuenta reactivada.");return;}
  const a=ds.act;
  if(a==="noop"){e.preventDefault();return;}
  if(a==="closeDlg"&&e.target===t||a==="closeDlg"&&t.tagName==="BUTTON"){S.dialog=null;render();return;}
  if(a==="toggleSide"){S.collapsed=!S.collapsed;render();}
  if(a==="clearEj"){S.ejFilter=null;render();}
  if(a==="play"){S.playing=!S.playing;render();}
  if(a==="back5"){S.cur=Math.max(0,S.cur-5);render();}
  if(a==="fwd5"){S.cur=Math.min(CALL.dur,S.cur+5);render();}
  if(a==="seek"){const r=t.getBoundingClientRect();S.cur=Math.round((e.clientX-r.left)/r.width*CALL.dur);render();}
  if(a==="ficha"){S.fichaOpen=!S.fichaOpen;render();}
  if(a==="addOpen"){S.addOpen=!S.addOpen;render();}
  if(a==="addSave"){S.addOpen=false;toast("Hallazgo agregado en el minuto "+mmss(S.cur)+".");}
  if(a==="corrCancel"){delete S.work[S.corrOpen];S.corrOpen=null;render();}
  if(a==="marktx"){const i=CALL.transcript.reduce((x,tt,j)=>tt[0]<=S.cur?j:x,0);S.work["tx"+i]=true;render();}
  if(a==="save"){if(pendingCount())return;S.saved++;if(S.saved>=2){go("a/end");toast("Caso enviado a aprobación.");}else{go("a/call");toast("Caso enviado a aprobación. Abriendo el siguiente.");}}
  if(a==="escOk"){S.dialog=null;go("a/call");toast("Caso escalado. Abriendo el siguiente.");}
  if(a==="selAll"){REV_OK.filter(r=>!S.approved.has(r[0])).slice(0,50).forEach(r=>S.sel.add(r[0]));render();}
  if(a==="batchOk"){S.lastBatch=[...S.sel];S.lastBatch.forEach(x=>S.approved.add(x));const n=S.sel.size;S.sel.clear();S.dialog=null;toast(n+" revisiones aprobadas.",true);}
  if(a==="undo"){(S.lastBatch||[]).forEach(x=>S.approved.delete(x));S.toast=null;toast("Aprobación deshecha.");}
  if(a==="reopenOk"){S.dialog=null;go("s/reviews");toast("Caso reabierto. Le avisamos al auditor.");}
  if(a==="overOk"){S.dialog=null;go("s/reviews");toast("Decisión cambiada. Se conserva la del auditor.");}
  if(a==="supApprove"){go("s/reviews");toast("Revisión aprobada y cerrada.");}
  if(a==="inviteOk"){S.dialog=null;S.accounts.push(["Auditor nuevo","nuevo@empresa-ejemplo.cl","Invitado","SSO"]);toast("Enviamos la invitación a nuevo@empresa-ejemplo.cl.");}
  if(a==="deactOk"){S.accounts[+t.dataset.i][2]="Desactivado";S.dialog=null;toast("Cuenta desactivada.");}
  if(a==="exportOk"){S.dialog=null;toast("Estamos preparando el archivo. Te avisaremos cuando esté listo.");}
  if(a==="fb"){S.drawer="fb";render();}
  if(a==="fbClose"){S.drawer=null;render();}
  if(a==="fbOk"){S.drawer=null;toast("Feedback guardado. Las llamadas asociadas quedaron «Con feedback».");}
});
document.addEventListener("change",e=>{if(e.target.dataset.act==="ejInput"){const v=e.target.value.trim();S.ejFilter=v&&EJS.includes(v)?v:null;render();}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&(S.dialog||S.drawer)){S.dialog=null;S.drawer=null;render();return;}
  const tag=(e.target.tagName||"").toLowerCase();if(["input","textarea","select"].includes(tag)||S.dialog)return;
  if(e.key==="?"){S.dialog="shortcuts";render();return;}
  if(S.screen!=="a/call")return;
  const ac=actionable();const i=ac.indexOf(S.focus);
  if(e.key==="j"||e.key==="J"){focusItem(ac[Math.max(0,i-1)]);}
  else if(e.key==="k"||e.key==="K"){focusItem(ac[Math.min(ac.length-1,i+1)]);}
  else if(e.key==="c"||e.key==="C"){if(fnd(S.focus).v!=="uncertain"){S.work[S.focus]={choice:"confirm",done:true};render();}}
  else if(e.key==="x"||e.key==="X"){S.work[S.focus]={choice:"compliant",v:"compliant"};S.corrOpen=S.focus;render();}
  else if(e.key==="e"||e.key==="E"){S.dialog="escalate";render();}
  else if(e.key===" "){e.preventDefault();S.playing=!S.playing;render();}
  else if(e.key==="ArrowLeft"){S.cur=Math.max(0,S.cur-5);render();}
  else if(e.key==="ArrowRight"){S.cur=Math.min(CALL.dur,S.cur+5);render();}
  else if(e.key==="Enter"&&!pendingCount()){document.querySelector('[data-act="save"]').click();}
});
setInterval(()=>{if(S.playing&&S.screen.endsWith("call")){S.cur=Math.min(CALL.dur,S.cur+1);const el=document.querySelector(".player span[style]");if(el)el.textContent=mmss(S.cur)+" / "+mmss(CALL.dur);}},1000);
/* barra del prototipo */
$("#pScreen").innerHTML=Object.entries(SCREENS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
$("#pScreen").addEventListener("change",e=>go(e.target.value));
$("#pState").addEventListener("change",e=>{S.state=e.target.value;render();});
$("#pAnn").addEventListener("click",()=>{S.ann=!S.ann;render();});
const h=location.hash.slice(1);if(SCREENS[h])go(h);else render();
</script>
</body>
