# Producción v0 en el EC2 (ver docs/deploy.md). Las imágenes vienen de ECR (scripts/deploy/deploy.sh las construye y
# las sube); la base es el RDS de DATABASE_URL en .env. deploy.sh deja este archivo, el Caddyfile y .env en
# /opt/call-audit y corre:
#   API_IMAGE=... FRONT_IMAGE=... DOMAIN=audit.qubicoenergy.com docker compose -f docker-compose.prod.yml up -d
services:
  api:
    image: ${API_IMAGE:?Falta API_IMAGE}
    env_file: .env
    restart: unless-stopped

  front:
    image: ${FRONT_IMAGE:?Falta FRONT_IMAGE}
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN, ej. audit.qubicoenergy.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [front]
    restart: unless-stopped

volumes:
  caddy_data:
